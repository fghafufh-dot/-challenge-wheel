<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة التحديات</title>
<style>
*{
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}
body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#090014,#16002b,#05000b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.container{
    width:100%;
    max-width:650px;
    text-align:center;
}
h1{
    margin:0 0 10px;
    font-size:34px;
}
.subtitle{
    color:#ddd;
    margin-bottom:20px;
}
.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:25px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.4);
}
button{
    border:0;
    border-radius:15px;
    padding:15px 22px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    margin:6px;
}
.primary{
    background:#7c3cff;
    color:white;
}
.gold{
    background:#ffd21c;
    color:#111;
}
.red{
    background:#ff3b4d;
    color:white;
}
input{
    width:100%;
    padding:15px;
    margin:7px 0;
    border-radius:12px;
    border:1px solid #555;
    background:#111;
    color:white;
    font-size:17px;
    text-align:center;
}
.category-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.category{
    padding:18px 10px;
    border-radius:18px;
    background:#191126;
    border:2px solid #38215c;
    font-size:18px;
    font-weight:900;
}
.category.selected{
    background:#7137c9;
    border-color:#ffd21c;
}
#wheelArea{
    display:none;
}
.wheel-wrap{
    position:relative;
    width:min(88vw,480px);
    height:min(88vw,480px);
    margin:20px auto;
}
#wheel{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    border:8px solid #fff;
    box-shadow:0 0 30px rgba(124,60,255,.7);
    transition:transform 5s cubic-bezier(.12,.75,.15,1);
}
.segment-name{
    position:absolute;
    width:145px;
    text-align:center;
    font-size:17px;
    font-weight:900;
    color:white;
    text-shadow:0 2px 5px #000;
    white-space:nowrap;
    transform:translate(-50%,-50%);
}
.pointer{
    position:absolute;
    z-index:10;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:35px solid #ffd21c;
    filter:drop-shadow(0 3px 5px #000);
}
.center-dot{
    position:absolute;
    z-index:9;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:70px;
    height:70px;
    border-radius:50%;
    background:#111;
    border:5px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}
#turnName{
    display:none;
    font-size:30px;
    font-weight:900;
    color:#ffd21c;
    margin:20px 0 10px;
}
#challengeBox{
    display:none;
    margin-top:15px;
    padding:20px;
    background:#120d1d;
    border:2px solid #7137c9;
    border-radius:20px;
}
.challenge-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:10px;
}
#challengeText{
    font-size:23px;
    line-height:1.7;
    font-weight:900;
}
#results{
    display:none;
}
.rank{
    padding:15px;
    margin:8px 0;
    border-radius:14px;
    background:#17101f;
    font-size:20px;
    font-weight:900;
}
.small{
    color:#bbb;
    font-size:14px;
}
.hidden{
    display:none!important;
}
</style>
</head>
<body>
<div class="container">
<div id="startPage" class="card">
    <h1>🎡 عجلة التحديات</h1>
    <div class="subtitle">لعبة جماعية سريعة وممتعة 🔥</div>
    <div class="small">إنشاء وتصميم عادل</div>
    <br>
    <button class="gold" onclick="showPlayers()">بدء اللعبة</button>
</div>
<div id="playersPage" class="card hidden">
    <h1>ضع الأسماء</h1>
    <div id="playersInputs"></div>
    <button class="primary" onclick="addPlayer()">➕ إضافة لاعب</button>
    <br>
    <button class="gold" onclick="goCategories()">التالي</button>
</div>
<div id="categoriesPage" class="card hidden">
    <h1>اختر نوع التحدي الي تبيه</h1>
    <div class="category-grid">
        <div class="category" onclick="toggleCategory(this,'مضحكة 😂')">
            مضحكة 😂
        </div>
        <div class="category" onclick="toggleCategory(this,'ذكاء 🧠')">
            ذكاء 🧠
        </div>
        <div class="category" onclick="toggleCategory(this,'تمثيل 🎭')">
            تمثيل 🎭
        </div>
        <div class="category" onclick="toggleCategory(this,'سرعة ⚡️')">
            سرعة ⚡️
        </div>
        <div class="category" onclick="toggleCategory(this,'جريئة 😈')">
            جريئة 😈
        </div>
        <div class="category" onclick="toggleCategory(this,'تحديات 👥')">
            تحديات 👥
        </div>
    </div>
    <br>
    <button class="gold" onclick="startGame()">ابدأ اللعب 🎮</button>
</div>
<div id="wheelArea" class="card">
    <h1>🎡 عجلة التحديات</h1>
    <div class="wheel-wrap">
        <div class="pointer"></div>
        <div id="wheel"></div>
        <div class="center-dot">🎯</div>
    </div>
    <button id="spinBtn" class="gold" onclick="spinWheel()">
        لف العجلة 🎡
    </button>
    <div id="turnName"></div>
    <div id="challengeBox">
        <div class="challenge-title">
            🎯 التحدي
        </div>
        <div id="challengeText"></div>
        <br>
        <button class="primary" onclick="finishChallenge()">
            تم ✅
        </button>
        <button class="red" onclick="skipChallenge()">
            سكيب ⏭️
        </button>
    </div>
    <br>
    <button class="red" onclick="endGame()">
        إنهاء اللعبة 🏆
    </button>
</div>
<div id="results" class="card">
    <h1>🏆 النتائج</h1>
    <div id="ranking"></div>
    <button class="gold" onclick="location.reload()">
        لعبة جديدة 🔄
    </button>
</div>
</div>

let players=[];
let selectedCategories=[];
let scores={};
let currentPlayerIndex=-1;
let wheelRotation=0;
let spinning=false;
function showPlayers(){
    document.getElementById("startPage").classList.add("hidden");
    document.getElementById("playersPage").classList.remove("hidden");
    createInitialInputs();
}
function createInitialInputs(){
    const box=document.getElementById("playersInputs");
    box.innerHTML="";
    for(let i=0;i<4;i++){
        const input=document.createElement("input");
        input.placeholder=(i+1)+"-";
        input.id="player"+i;
        box.appendChild(input);
    }
}
function addPlayer(){
    const inputs=document.querySelectorAll("#playersInputs input");
    if(inputs.length>=12){
        alert("الحد الأقصى 12 لاعب");
        return;
    }
    const i=inputs.length;
    const input=document.createElement("input");
    input.placeholder=(i+1)+"-";
    input.id="player"+i;
    document.getElementById("playersInputs").appendChild(input);
}
function goCategories(){
    players=[];
    const inputs=document.querySelectorAll("#playersInputs input");
    inputs.forEach(input=>{
        const name=input.value.trim();
        if(name){
            players.push(name);
        }
    });
    if(players.length<2){
        alert("لازم تدخل لاعبين على الأقل");
        return;
    }
    document.getElementById("playersPage").classList.add("hidden");
    document.getElementById("categoriesPage").classList.remove("hidden");
}
function toggleCategory(element,name){
    if(selectedCategories.includes(name)){
        selectedCategories=selectedCategories.filter(x=>x!==name);
        element.classList.remove("selected");
    }else{
        selectedCategories.push(name);
        element.classList.add("selected");
    }
}
function startGame(){
    if(selectedCategories.length===0){
        alert("اختر نوع تحدي واحد على الأقل");
        return;
    }
    scores={};
    players.forEach(player=>{
        scores[player]=0;
    });
    document.getElementById("categoriesPage").classList.add("hidden");
    document.getElementById("wheelArea").style.display="block";
    buildWheel();
}
function buildWheel(){
    const wheel=document.getElementById("wheel");
    wheel.innerHTML="";
    const n=players.length;
    const colors=[
        "#7c3cff",
        "#e83e8c",
        "#ff5722",
        "#00a8ff",
        "#00c853",
        "#ffb300",
        "#9c27b0",
        "#03a9f4",
        "#f44336",
        "#8bc34a",
        "#673ab7",
        "#ff9800"
    ];
    const angle=360/n;
    let gradient="conic-gradient(";
    players.forEach((player,i)=>{
        gradient+=`${colors[i%colors.length]} ${i*angle}deg ${(i+1)*angle}deg`;
        if(i<players.length-1){
            gradient+=",";
        }
    });
    gradient+=")";
    wheel.style.background=gradient;
    players.forEach((player,i)=>{
        const nameElement=document.createElement("div");
        nameElement.className="segment-name";
        nameElement.textContent=player;
        const start=i*angle;
        const middle=start+angle/2;
        const radius=36;
        const x=50+radius*Math.cos((middle-90)*Math.PI/180);
        const y=50+radius*Math.sin((middle-90)*Math.PI/180);
        nameElement.style.left=x+"%";
        nameElement.style.top=y+"%";
        nameElement.style.transform=
            `translate(-50%,-50%) skewY(${-(90-angle)}deg) rotate(${-start}deg)`;
        wheel.appendChild(nameElement);
    });
}
function spinWheel(){
    if(spinning || currentPlayerIndex!==-1){
        return;
    }
    spinning=true;
    document.getElementById("spinBtn").disabled=true;
    const n=players.length;
    const selected=Math.floor(Math.random()*n);
    currentPlayerIndex=selected;
    const angle=360/n;
    const target=360-(selected*angle+angle/2);
    wheelRotation+=360*5+target;
    document.getElementById("wheel").style.transform=
        `rotate(${wheelRotation}deg)`;
    setTimeout(()=>{
        showChallenge(selected);
        spinning=false;
    },5100);
}
function showChallenge(index){
    const player=players[index];
    const turnName=document.getElementById("turnName");
    turnName.textContent="🔥 تحدي "+player;
    turnName.style.display="block";
    const category=
        selectedCategories[
            Math.floor(Math.random()*selectedCategories.length)
        ];
    const challenges=data[category];
    const challenge=
        challenges[
            Math.floor(Math.random()*challenges.length)
        ];
    document.getElementById("challengeText").textContent=challenge;
    document.getElementById("challengeBox").style.display="block";
}
function finishChallenge(){
    if(currentPlayerIndex===-1){
        return;
    }
    const player=players[currentPlayerIndex];
    scores[player]++;
    nextRound();
}
function skipChallenge(){
    nextRound();
}
function nextRound(){
    currentPlayerIndex=-1;
    document.getElementById("turnName").style.display="none";
    document.getElementById("challengeBox").style.display="none";
    document.getElementById("spinBtn").disabled=false;
}
function endGame(){
    document.getElementById("wheelArea").style.display="none";
    document.getElementById("results").style.display="block";
    const ranking=document.getElementById("ranking");
    ranking.innerHTML="";
    const sorted=players
        .map(player=>({
            name:player,
            score:scores[player]
        }))
        .sort((a,b)=>b.score-a.score);
    sorted.forEach((item,index)=>{
        const div=document.createElement("div");
        div.className="rank";
        let medal="";
        if(index===0) medal="🥇";
        else if(index===1) medal="🥈";
        else if(index===2) medal="🥉";
        div.textContent=
            `${medal} ${index+1}. ${item.name} — ${item.score} نقطة`;
        ranking.appendChild(div);
    });
}
