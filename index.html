<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎡 عجلة التحديات</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:linear-gradient(135deg,#090b18,#15102b);
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px
}
.container{
width:100%;
max-width:700px;
background:rgba(20,18,40,.94);
border:1px solid #3d3269;
border-radius:25px;
padding:25px;
box-shadow:0 20px 60px rgba(0,0,0,.5)
}
h1{text-align:center;color:#ffd43b;margin:5px 0 10px}
.subtitle{text-align:center;color:#bbb;margin-bottom:25px}
.screen{display:none}
.screen.active{display:block}
input{
width:100%;
padding:14px;
margin:7px 0;
border:1px solid #4d4375;
border-radius:12px;
background:#0f1020;
color:white;
font-size:16px
}
button{
border:0;
border-radius:13px;
padding:13px 18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:6px;
transition:.2s
}
button:active{transform:scale(.96)}
.primary{background:#7c4dff;color:white}
.gold{background:#ffd43b;color:#151515}
.red{background:#ff4d6d;color:white}
.gray{background:#393650;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.players{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
margin-top:10px
}
.player{
background:#292541;
padding:10px;
border-radius:10px;
text-align:center
}
.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.cat{
padding:20px 10px;
background:#211d3a;
border:2px solid #3d3561;
border-radius:15px;
text-align:center;
cursor:pointer;
font-weight:bold
}
.cat.selected{
border-color:#ffd43b;
background:#392f18
}
#wheelWrap{
position:relative;
width:min(90vw,500px);
margin:15px auto
}
canvas{
width:100%;
height:auto;
display:block;
transition:transform 4.7s cubic-bezier(.12,.72,.12,1);
border-radius:50%
}
.pointer{
position:absolute;
top:-4px;
left:50%;
transform:translateX(-50%);
width:0;
height:0;
border-left:18px solid transparent;
border-right:18px solid transparent;
border-top:42px solid #ffd43b;
z-index:5;
filter:drop-shadow(0 3px 4px #000)
}
.center{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:72px;
height:72px;
border-radius:50%;
background:#17142c;
border:7px solid #ffd43b;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
z-index:4
}
.turn{
text-align:center;
font-size:24px;
font-weight:bold;
color:#ffd43b;
margin:10px
}
.challenge{
background:#211d3a;
border:1px solid #51467d;
border-radius:18px;
padding:20px;
text-align:center;
font-size:20px;
line-height:1.7;
margin-top:15px
}
.actions{
display:flex;
justify-content:center;
flex-wrap:wrap;
margin-top:10px
}
.timer{
font-size:34px;
font-weight:bold;
color:#ffd43b;
text-align:center;
margin:5px
}
.scoreboard{
margin-top:15px
}
.scoreRow{
display:flex;
justify-content:space-between;
padding:14px;
margin:7px 0;
background:#211d3a;
border-radius:12px
}
.small{color:#aaa;font-size:13px;text-align:center}
</style>
</head>

<body>
<div class="container">

<div id="start" class="screen active">
<h1>🎡 عجلة التحديات</h1>
<div class="subtitle">لعبة جماعية سريعة وممتعة 🔥</div>
<div style="text-align:center;color:#bbb;margin:20px 0">
إنشاء وتصميم عادل
</div>
<div style="text-align:center">
<button class="gold" onclick="showPlayers()">بدء اللعبة</button>
</div>
</div>

<div id="playersScreen" class="screen">
<h1>👥 اللاعبين</h1>
<div class="subtitle">أدخل أسماء اللاعبين</div>

<div id="inputs"></div>

<div style="text-align:center">
<button class="primary" onclick="addPlayer()">➕ إضافة لاعب</button>
<br>
<button class="gold" onclick="goCategories()">التالي ➡️</button>
</div>

<div class="small">لازم يكون عدد اللاعبين من 2 إلى 12</div>
</div>

<div id="categoriesScreen" class="screen">
<h1>🎯 اختر نوع التحدي</h1>
<div class="subtitle">تقدر تختار أكثر من نوع</div>

<div class="categories">
<div class="cat" data-cat="funny" onclick="toggleCat(this)">مضحكة 😂</div>
<div class="cat" data-cat="smart" onclick="toggleCat(this)">ذكاء 🧠</div>
<div class="cat" data-cat="acting" onclick="toggleCat(this)">تمثيل 🎭</div>
<div class="cat" data-cat="speed" onclick="toggleCat(this)">سرعة ⚡️</div>
<div class="cat" data-cat="bold" onclick="toggleCat(this)">جريئة 😈</div>
<div class="cat" data-cat="challenge" onclick="toggleCat(this)">تحديات 👥</div>
</div>

<div style="text-align:center;margin-top:15px">
<button class="gold" onclick="startGame()">ابدأ اللعب 🔥</button>
</div>
</div>

<div id="gameScreen" class="screen">
<h1>🎡 عجلة التحديات</h1>

<div id="wheelWrap">
<div class="pointer"></div>
<canvas id="wheel" width="600" height="600"></canvas>
<div class="center">🎡</div>
</div>

<div style="text-align:center">
<button id="spinBtn" class="gold" onclick="spinWheel()">لف العجلة 🎡</button>
<button class="gray" onclick="showResults()">🏆 النتائج</button>
</div>

<div id="challengeArea" class="hidden">
<div id="turn" class="turn"></div>
<div id="timer" class="timer"></div>
<div id="challenge" class="challenge"></div>

<div class="actions">
<button id="doneBtn" class="gold" onclick="finishChallenge()">تم ✅</button>
<button id="skipBtn" class="gray" onclick="nextTurn()">سكيب ⏭️</button>
</div>
</div>
</div>

<div id="resultsScreen" class="screen">
<h1>🏆 النتائج</h1>
<div id="scoreboard" class="scoreboard"></div>

<div style="text-align:center">
<button class="gold" onclick="backToGame()">العودة للعبة 🎡</button>
<button class="red" onclick="location.reload()">لعبة جديدة 🔄</button>
</div>
</div>

</div>

let players=[];
let selectedCats=[];
let scores={};
let currentPlayerIndex=-1;
let spinning=false;
let rotation=0;
let timerInterval=null;
let timerValue=0;
let usedQuestions={};

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

function show(id){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function showPlayers(){
show("playersScreen");
document.getElementById("inputs").innerHTML="";
players=[];
for(let i=0;i<2;i++) addPlayer();
}

function addPlayer(){
const box=document.getElementById("inputs");
if(box.children.length>=12)return;
const input=document.createElement("input");
input.placeholder="اسم اللاعب "+(box.children.length+1);
input.maxLength=20;
box.appendChild(input);
}

function goCategories(){
const inputs=[...document.querySelectorAll("#inputs input")];
players=inputs.map(x=>x.value.trim()).filter(Boolean);

if(players.length<2||players.length>12){
alert("أدخل من 2 إلى 12 لاعب");
return;
}

scores={};
players.forEach(p=>scores[p]=0);
show("categoriesScreen");
}

function toggleCat(el){
el.classList.toggle("selected");
}

function startGame(){
selectedCats=[...document.querySelectorAll(".cat.selected")].map(x=>x.dataset.cat);

if(!selectedCats.length){
alert("اختر نوع تحدي واحد على الأقل");
return;
}

usedQuestions={};
rotation=0;
canvas.style.transform="rotate(0deg)";
drawWheel();
show("gameScreen");
}

function drawWheel(){
const n=players.length;
const slice=Math.PI*2/n;
const colors=["#7c4dff","#ff4d6d","#00b8d4","#ff9800","#4caf50","#e91e63","#3f51b5","#fbc02d","#009688","#8e24aa","#fb8c00","#3949ab"];

ctx.clearRect(0,0,600,600);

for(let i=0;i<n;i++){
const start=-Math.PI/2+i*slice;
const end=start+slice;

ctx.beginPath();
ctx.moveTo(300,300);
ctx.arc(300,300,285,start,end);
ctx.closePath();
ctx.fillStyle=colors[i%colors.length];
ctx.fill();
ctx.strokeStyle="#fff";
ctx.lineWidth=3;
ctx.stroke();

ctx.save();
ctx.translate(300,300);
ctx.rotate(start+slice/2);
ctx.textAlign="right";
ctx.fillStyle="#fff";
ctx.font="bold 25px Arial";
ctx.shadowColor="rgba(0,0,0,.5)";
ctx.shadowBlur=4;
ctx.fillText(players[i],250,9);
ctx.restore();
}

ctx.beginPath();
ctx.arc(300,300,285,0,Math.PI*2);
ctx.strokeStyle="#ffd43b";
ctx.lineWidth=8;
ctx.stroke();
}

function getQuestions(){
let list=[];
selectedCats.forEach(cat=>{
if(data[cat]) list=list.concat(data[cat].map(q=>({q,cat})));
});
return list;
}

function getUniqueQuestion(){
const all=getQuestions();
if(!usedQuestions.all)usedQuestions.all=new Set();

let available=all.filter(x=>!usedQuestions.all.has(x.q));

if(!available.length){
usedQuestions.all=new Set();
available=all;
}

const item=available[Math.floor(Math.random()*available.length)];
usedQuestions.all.add(item.q);
return item;
}

function spinWheel(){
if(spinning||!players.length)return;

spinning=true;
clearInterval(timerInterval);

document.getElementById("challengeArea").classList.add("hidden");
document.getElementById("spinBtn").disabled=true;

const n=players.length;
const slice=360/n;

currentPlayerIndex=Math.floor(Math.random()*n);

/*
نقطة منتصف اللاعب تكون:
-90 + (index + 0.5) * slice

ولكي تصل هذه النقطة إلى السهم الموجود بالأعلى (-90):
نحتاج دوراناً يساوي -(index + 0.5)*slice
*/
const target=(-((currentPlayerIndex+0.5)*slice)+360)%360;

const current=((rotation%360)+360)%360;
let delta=(target-current+360)%360;

rotation+=1440+delta;

canvas.style.transform=`rotate(${rotation}deg)`;

setTimeout(()=>{
spinning=false;
document.getElementById("spinBtn").disabled=false;
showChallenge();
},4700);
}

function showChallenge(){
const player=players[currentPlayerIndex];
const item=getUniqueQuestion();

document.getElementById("turn").textContent="🔥 "+player;
document.getElementById("challenge").textContent=item.q;
document.getElementById("challengeArea").classList.remove("hidden");

document.getElementById("doneBtn").disabled=false;
document.getElementById("skipBtn").disabled=false;

if(item.cat==="speed"){
startTimer();
}else{
document.getElementById("timer").textContent="";
}
}

function startTimer(){
clearInterval(timerInterval);
timerValue=6;
document.getElementById("timer").textContent="⏱️ "+timerValue;

timerInterval=setInterval(()=>{
timerValue--;
document.getElementById("timer").textContent="⏱️ "+timerValue;

if(timerValue<=0){
clearInterval(timerInterval);
document.getElementById("timer").textContent="انتهى الوقت ⏰";

document.getElementById("doneBtn").disabled=true;
document.getElementById("skipBtn").disabled=true;

setTimeout(()=>{
nextTurn();
},700);
}
},1000);
}

function finishChallenge(){
if(currentPlayerIndex<0)return;

clearInterval(timerInterval);

scores[players[currentPlayerIndex]]++;
nextTurn();
}

function nextTurn(){
clearInterval(timerInterval);

document.getElementById("challengeArea").classList.add("hidden");
document.getElementById("timer").textContent="";
document.getElementById("doneBtn").disabled=false;
document.getElementById("skipBtn").disabled=false;
document.getElementById("spinBtn").disabled=false;
}

function showResults(){
clearInterval(timerInterval);

const board=document.getElementById("scoreboard");

const sorted=[...players].sort((a,b)=>scores[b]-scores[a]);

board.innerHTML=sorted.map((p,i)=>`
<div class="scoreRow">
<span>${i+1}. ${escapeHtml(p)}</span>
<strong>${scores[p]} نقطة</strong>
</div>
`).join("");

show("resultsScreen");
}

function backToGame(){
show("gameScreen");
drawWheel();
}

function escapeHtml(str){
return str.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}

drawWheel();
</script>
