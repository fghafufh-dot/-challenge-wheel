<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎡 عجلة التحديات</title>

<style>
*{
 box-sizing:border-box;
 font-family:Arial,Tahoma,sans-serif;
}

body{
 margin:0;
 min-height:100vh;
 background:linear-gradient(135deg,#0f172a,#1e293b);
 color:#fff;
 text-align:center;
}

.container{
 width:min(1050px,94%);
 margin:auto;
}

header{
 padding:22px 10px;
}

h1{
 margin:0;
 font-size:34px;
}

.subtitle{
 color:#cbd5e1;
 margin-top:8px;
}

.card{
 background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.12);
 border-radius:22px;
 padding:20px;
 margin:18px 0;
 box-shadow:0 12px 30px rgba(0,0,0,.25);
}

input,select{
 width:100%;
 padding:14px;
 border:0;
 border-radius:12px;
 margin:6px 0;
 font-size:17px;
 outline:none;
}

button{
 border:0;
 border-radius:13px;
 padding:13px 20px;
 margin:6px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 background:#38bdf8;
 color:#082f49;
}

button:active{
 transform:scale(.96);
}

.hidden{
 display:none!important;
}

.types{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:10px;
 margin-top:15px;
}

.type{
 padding:18px 10px;
 border-radius:16px;
 background:rgba(255,255,255,.08);
 border:2px solid transparent;
 cursor:pointer;
 font-size:18px;
 font-weight:bold;
}

.type.selected{
 border-color:#38bdf8;
 background:rgba(56,189,248,.2);
}

.players{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:10px;
}

.player{
 padding:12px;
 border-radius:14px;
 background:rgba(255,255,255,.08);
}

.player.active{
 border:2px solid #38bdf8;
}

.points{
 color:#facc15;
 margin-top:5px;
}

.wheelWrap{
 position:relative;
 width:min(430px,90vw);
 height:min(430px,90vw);
 margin:20px auto;
}

#wheel{
 width:100%;
 height:100%;
 border-radius:50%;
 border:9px solid #fff;
 transition:transform 4s cubic-bezier(.15,.75,.15,1);
}

.pointer{
 position:absolute;
 top:-5px;
 left:50%;
 transform:translateX(-50%);
 z-index:5;
 width:0;
 height:0;
 border-left:20px solid transparent;
 border-right:20px solid transparent;
 border-top:45px solid #ef4444;
}

.spin{
 background:#22c55e;
 color:#052e16;
 font-size:21px;
 padding:15px 35px;
}

.category{
 font-size:27px;
 font-weight:bold;
 margin:15px;
}

.question{
 font-size:24px;
 line-height:1.7;
 margin:25px 5px;
}

.timer{
 font-size:60px;
 color:#facc15;
 font-weight:bold;
}

.answers{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
}

.rank{
 display:flex;
 justify-content:space-between;
 padding:12px;
 margin:6px 0;
 background:rgba(255,255,255,.08);
 border-radius:12px;
}

.footer{
 opacity:.65;
 font-size:13px;
 padding:25px;
}
</style>
</head>

<body>

<header>
<h1>🎡 عجلة التحديات</h1>
<div class="subtitle">اختر نوع التحديات وابدأ اللعب 🔥</div>
</header>

<div class="container">

<!-- الإعداد -->
<div id="setup" class="card">

<div class="types">

</div>

⚡ سرعة
</div>

<div class="type" data-type="BOLD"

🔥 جريئة
</div>

<div class="type" data-type="CHALLENGE"

🏆 تحديات
</div>

</div>

<br>

<button onclick="startGame()">
🎮 ابدأ اللعبة
</button>

</div>


<!-- اللعبة -->
<div id="game" class="hidden">

<div class="card">

<h2>🎮 الدور على</h2>

<div id="currentPlayer"
style="font-size:28px;color:#38bdf8;font-weight:bold">
</div>

<br>

<div id="players" class="players"></div>

</div>


<div class="card">

<div class="wheelWrap">

<div class="pointer"></div>

<canvas id="wheel" width="500" height="500"></canvas>

</div>

<button id="spinButton"
class="spin"
onclick="spinWheel()">

</button>

<div id="category" class="category"></div>

</div>


<!-- التحدي -->
<div id="questionBox" class="card hidden">

<div id="questionCategory"
class="category">
</div>

<div id="question"
class="question">
</div>

<div id="timer"
class="timer hidden">
6
</div>

<div class="answers">

<button onclick="success()">
✅ نجح
</button>

<button onclick="failed()">
❌ لم ينجح
</button>

</div>

</div>


<!-- النتائج -->
<div class="card">

<h2>🏆 النقاط</h2>

<div id="leaderboard"></div>

</div>

</div>


<div class="footer">
المصمم عادل الشمري
</div>

</div>

"اختر لاعبًا واجعله يعطيك تحديًا لمدة 10 ثواني.",
"نفذ حركة يختارها اللاعبون لمدة 10 ثواني."

]

};


/* =========================================
   التأكد من أن كل قسم = 100
========================================= */

Object.keys(challenges).forEach(key=>{

 if(challenges[key].length !== 100){

   console.warn(
     key+" يحتوي على "+
     challenges[key].length+
     " تحدي"
   );

 }

});


/* =========================================
   المتغيرات
========================================= */

let players=[];

let currentPlayer=0;

let selectedType="ALL";

let spinning=false;

let rotation=0;

let currentCategory=null;

let timerInterval=null;

let usedQuestions={};


/* =========================================
   إضافة اللاعبين
========================================= */

function addPlayer(){

 const box=document.getElementById("playerInputs");

 if(box.children.length>=12){
   alert("الحد الأقصى 12 لاعب");
   return;
 }

 const input=document.createElement("input");

 input.placeholder=
 "اسم اللاعب "+(box.children.length+1);

 box.appendChild(input);
}


addPlayer();
addPlayer();


/* =========================================
   اختيار النوع
========================================= */

function chooseType(element,type){

 document
 .querySelectorAll(".type")
 .forEach(x=>x.classList.remove("selected"));

 element.classList.add("selected");

 selectedType=type;
}


/* =========================================
   بدء اللعبة
========================================= */

function startGame(){

 const inputs=
 [...document.querySelectorAll("#playerInputs input")];

 players=inputs.map((input,index)=>({

   name:
   input.value.trim() ||
   "اللاعب "+(index+1),

   score:0

 }));

 if(players.length<2){

   alert("أضف لاعبين على الأقل");

   return;
 }

 usedQuestions={};

 currentPlayer=0;

 document
 .getElementById("setup")
 .classList.add("hidden");

 document
 .getElementById("game")
 .classList.remove("hidden");

 drawWheel();

 updatePlayers();

}


/* =========================================
   أنواع العجلة حسب الاختيار
========================================= */

function getWheelCategories(){

 if(selectedType==="ALL"){

   return Object.keys(categories);

 }

 return [selectedType];

}


/* =========================================
   رسم العجلة
========================================= */

const canvas=
document.getElementById("wheel");

const ctx=
canvas.getContext("2d");


function drawWheel(){

 const list=getWheelCategories();

 const size=canvas.width;

 const center=size/2;

 const radius=size/2;

 const slice=
 (Math.PI*2)/list.length;

 ctx.clearRect(0,0,size,size);

 list.forEach((key,index)=>{

   const cat=categories[key];

   const start=index*slice;

   const end=start+slice;

   ctx.beginPath();

   ctx.moveTo(center,center);

   ctx.arc(
     center,
     center,
     radius,
     start,
     end
   );

   ctx.closePath();

   ctx.fillStyle=cat.color;

   ctx.fill();

   ctx.save();

   ctx.translate(center,center);

   ctx.rotate(start+slice/2);

   ctx.textAlign="right";

   ctx.fillStyle="#fff";

   ctx.font="bold 22px Arial";

   ctx.fillText(
     cat.name,
     radius-25,
     8
   );

   ctx.restore();

 });

}


/* =========================================
   تدوير العجلة
========================================= */

function spinWheel(){

 if(spinning)return;

 spinning=true;

 document
 .getElementById("spinButton")
 .disabled=true;

 const list=getWheelCategories();

 const index=
 Math.floor(Math.random()*list.length);

 const slice=360/list.length;

 const target=
 360-(index*slice+slice/2);

 rotation+=
 360*6+
 target;

 canvas.style.transform=
 `rotate(${rotation}deg)`;

 setTimeout(()=>{

   currentCategory=list[index];

   document
   .getElementById("category")
   .textContent=
   categories[currentCategory].name;

   spinning=false;

   document
   .getElementById("spinButton")
   .disabled=false;

   showChallenge();

 },4200);

}


/* =========================================
   اختيار تحدي بدون تكرار
========================================= */

function getQuestion(type){

 if(!usedQuestions[type]){
   usedQuestions[type]=[];
 }

 if(usedQuestions[type].length>=
    challenges[type].length){

   usedQuestions[type]=[];
 }

 let index;

 do{

   index=
   Math.floor(
     Math.random()*
     challenges[type].length
   );

 }while(
   usedQuestions[type].includes(index)
 );

 usedQuestions[type].push(index);

 return challenges[type][index];
}


/* =========================================
   عرض التحدي
========================================= */

function showChallenge(){

 const text=
 getQuestion(currentCategory);

 document
 .getElementById("questionCategory")
 .textContent=
 categories[currentCategory].name;

 document
 .getElementById("question")
 .textContent=text;

 document
 .getElementById("questionBox")
 .classList.remove("hidden");

 if(currentCategory==="FAST"){

   startTimer();

 }else{

   document
   .getElementById("timer")
   .classList.add("hidden");

 }

}


/* =========================================
   مؤقت السرعة
========================================= */

function startTimer(){

 clearInterval(timerInterval);

 const timer=
 document.getElementById("timer");

 timer.classList.remove("hidden");

 let time=6;

 timer.textContent=time;

 timerInterval=
 setInterval(()=>{

   time--;

   timer.textContent=time;

   if(time<=0){

     clearInterval(timerInterval);

     timer.textContent="⏰ انتهى الوقت";

   }

 },1000);

}


/* =========================================
   نجاح
========================================= */

function success(){

 clearInterval(timerInterval);

 players[currentPlayer].score++;

 updatePlayers();

 nextTurn();

}


/* =========================================
   فشل
========================================= */

function failed(){

 clearInterval(timerInterval);

 nextTurn();

}


/* =========================================
   الدور التالي
========================================= */

function nextTurn(){

 clearInterval(timerInterval);

 document
 .getElementById("questionBox")
 .classList.add("hidden");

 document
 .getElementById("timer")
 .classList.add("hidden");

 document
 .getElementById("category")
 .textContent="";

 currentPlayer++;

 if(currentPlayer>=players.length){
   currentPlayer=0;
 }

 updatePlayers();

}


/* =========================================
   تحديث اللاعبين
========================================= */

function updatePlayers(){

 const box=
 document.getElementById("players");

 box.innerHTML="";

 players.forEach((player,index)=>{

   const div=
   document.createElement("div");

   div.className=
   "player "+
   (index===currentPlayer?"active":"");

   div.innerHTML=`

   <b>${escapeHtml(player.name)}</b>

   <div class="points">
   ⭐ ${player.score}
   </div>

   `;

   box.appendChild(div);

 });

 document
 .getElementById("currentPlayer")
 .textContent=
 players[currentPlayer].name;

 updateLeaderboard();

}


/* =========================================
   لوحة النتائج
========================================= */

function updateLeaderboard(){

 const box=
 document.getElementById("leaderboard");

 const sorted=
 [...players].sort(
   (a,b)=>b.score-a.score
 );

 box.innerHTML="";

 sorted.forEach((player,index)=>{

   const div=
   document.createElement("div");

   div.className="rank";

   div.innerHTML=`

   <span>
   ${index+1}. ${escapeHtml(player.name)}
   </span>

   <span>
   ⭐ ${player.score}
   </span>

   `;

   box.appendChild(div);

 });

}


/* =========================================
   حماية أسماء اللاعبين
========================================= */

function escapeHtml(text){

 const div=
 document.createElement("div");

 div.textContent=text;

 return div.innerHTML;

}


/* =========================================
   تشغيل العجلة أول مرة
========================================= */

drawWheel();

</script>

</html>
