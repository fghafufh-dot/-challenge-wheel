<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎡 عجلة التحديات</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    color:#fff;
}

header{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    padding:20px 10px;
}

.container{
    width:min(950px,94%);
    margin:auto;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.hidden{
    display:none!important;
}

input{
    width:100%;
    padding:14px;
    margin:6px 0;
    border:0;
    outline:0;
    border-radius:12px;
    font-size:17px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    margin:5px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.96);
}

.add{
    background:#2563eb;
    color:white;
}

.start{
    width:100%;
    background:#22c55e;
    color:white;
    font-size:20px;
}

.types{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:15px 0;
}

.type{
    padding:18px 10px;
    background:#1e293b;
    border:2px solid transparent;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.type.selected{
    background:#075985;
    border-color:#38bdf8;
}

#game{
    position:relative;
}

.back{
    position:absolute;
    top:10px;
    right:10px;
    background:#ef4444;
    color:white;
    z-index:10;
}

.current{
    text-align:center;
    font-size:28px;
    color:#38bdf8;
    font-weight:bold;
}

.wheelWrap{
    width:min(500px,90vw);
    aspect-ratio:1;
    margin:30px auto 15px;
    position:relative;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:40px solid #ef4444;
}

.spin{
    display:block;
    width:min(400px,90%);
    margin:15px auto;
    background:#f59e0b;
    color:white;
    font-size:22px;
}

.selectedPlayer{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#38bdf8;
    margin:15px;
}

.category{
    text-align:center;
    font-size:24px;
    color:#38bdf8;
    font-weight:bold;
    margin:15px;
}

.question{
    text-align:center;
    font-size:24px;
    line-height:1.7;
    background:rgba(0,0,0,.2);
    border-radius:15px;
    padding:20px;
}

.answers{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

.success{
    background:#22c55e;
    color:white;
}

.fail{
    background:#ef4444;
    color:white;
}

.timer{
    width:75px;
    height:75px;
    margin:20px auto;
    border-radius:50%;
    background:#ef4444;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}

.playerList{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

.player{
    background:#334155;
    padding:10px 15px;
    border-radius:12px;
}

.player.active{
    background:#0284c7;
}

.leader{
    display:flex;
    justify-content:space-between;
    background:#1e293b;
    padding:12px;
    border-radius:12px;
    margin:7px 0;
}

.footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
}

@media(max-width:600px){

    header{
        font-size:24px;
    }

    .types{
        grid-template-columns:1fr;
    }

    .question{
        font-size:20px;
    }

    .back{
        position:relative;
        top:auto;
        right:auto;
        width:100%;
        margin-bottom:10px;
    }
}
</style>
</head>

<body>

<header>🎡 عجلة التحديات</header>

<div class="container">

<!-- الإعداد -->
<div id="setup" class="card">

<div class="types">

</div>

</div>

</div>

<button class="start" onclick="startGame()">

</button>

</div>


<!-- اللعبة -->
<div id="game" class="hidden">

<button class="back" onclick="backToSetup()">

</button>


<div class="card">

<h2>🎯 اللاعب المختار</h2>

<div id="currentPlayer" class="current">
-
</div>

<div id="players"
class="playerList">
</div>

</div>


<div class="card">

<div class="wheelWrap">

<div class="pointer"></div>

<canvas id="wheel"

</canvas>

</div>

<button id="spinButton"

<div id="selectedPlayer"

</div>

</div>


<!-- السؤال -->
<div id="questionBox"
class="card hidden">

<div id="questionCategory"
class="category">
</div>

<div id="question"
class="question">
</div>

<div id="timer"
class="timer hidden">
10
</div>

<div class="answers">

<button class="success"
onclick="success()">

</button>

<button class="fail"

</div>

</div>


<!-- النقاط -->
<div class="card">

<div id="leaderboard">
</div>

</div>

</div>

<div class="footer">

</div>

let players=[];
let selectedType="ALL";
let selectedPlayerIndex=-1;
let currentQuestionType=null;

let rotation=0;
let spinning=false;
let timerInterval=null;

let usedQuestions={};


/* =========================
   اللاعبين
========================= */

function addPlayer(){

    const box=document.getElementById("playerInputs");

    if(box.children.length>=12){
        alert("الحد الأقصى 12 لاعب");
        return;
    }

    const input=document.createElement("input");

    input.placeholder=
        "اسم اللاعب "+(box.children.length+1);

    box.appendChild(input);
}

addPlayer();
addPlayer();


/* =========================
   اختيار النوع
========================= */

function chooseType(el,type){

    selectedType=type;

    document
    .querySelectorAll(".type")
    .forEach(x=>x.classList.remove("selected"));

    el.classList.add("selected");
}


/* =========================
   بدء اللعبة
========================= */

function startGame(){

    const inputs=
        document.querySelectorAll("#playerInputs input");

    players=[];

    inputs.forEach(input=>{

        const name=input.value.trim();

        if(name){

            players.push({
                name:name,
                score:0
            });

        }

    });


    if(players.length<1){

        alert("اكتب اسم لاعب واحد على الأقل");

        return;
    }


    selectedPlayerIndex=-1;

    usedQuestions={};

    Object.keys(challenges).forEach(type=>{
        usedQuestions[type]=[];
    });


    document
    .getElementById("setup")
    .classList.add("hidden");

    document
    .getElementById("game")
    .classList.remove("hidden");


    updatePlayers();

    drawWheel();
}


/* =========================
   العجلة = أسماء اللاعبين
========================= */

function drawWheel(){

    const canvas=document.getElementById("wheel");
    const ctx=canvas.getContext("2d");

    const center=canvas.width/2;
    const radius=center-10;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const count=players.length;

    if(!count)return;


    const slice=(Math.PI*2)/count;


    players.forEach((player,index)=>{

        const start=
            rotation+(index*slice);

        const end=
            start+slice;


        ctx.beginPath();

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();


        const colors=[
            "#ef4444",
            "#f97316",
            "#eab308",
            "#22c55e",
            "#06b6d4",
            "#3b82f6",
            "#8b5cf6",
            "#ec4899",
            "#14b8a6",
            "#84cc16",
            "#f43f5e",
            "#6366f1"
        ];


        ctx.fillStyle=
            colors[index%colors.length];

        ctx.fill();


        ctx.strokeStyle="#fff";
        ctx.lineWidth=3;
        ctx.stroke();


        ctx.save();

        ctx.translate(center,center);

        ctx.rotate(
            start+slice/2
        );

        ctx.textAlign="right";

        ctx.fillStyle="#fff";

        let fontSize=22;

        if(player.name.length>12)
            fontSize=16;

        if(player.name.length>18)
            fontSize=13;

        ctx.font=
            "bold "+fontSize+"px Arial";


        ctx.fillText(
            player.name,
            radius-20,
            7
        );

        ctx.restore();

    });


    /* الدائرة الوسطى */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        60,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#0f172a";
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=4;
    ctx.stroke();


    ctx.fillStyle="#fff";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font="bold 24px Arial";

    ctx.fillText(
        "🎡",
        center,
        center
    );

}


/* =========================
   لف العجلة واختيار لاعب
========================= */

function spinWheel(){

    if(spinning)return;

    if(players.length===0)return;


    spinning=true;

    clearInterval(timerInterval);


    document
    .getElementById("questionBox")
    .classList.add("hidden");


    document
    .getElementById("spinButton")
    .disabled=true;


    /*
       نختار لاعب عشوائي
       ثم نجعل دوران العجلة
       ينتهي عند هذا اللاعب
    */

    const winner=
        Math.floor(
            Math.random()*players.length
        );


    const slice=
        (Math.PI*2)/players.length;


    /*
       زاوية اللاعب المستهدف
       عند السهم الموجود بالأعلى
    */

    const targetAngle=
        -(winner*slice+slice/2)
        +Math.PI/2;


    let current=
        rotation%(Math.PI*2);

    if(current<0)
        current+=Math.PI*2;


    let target=
        targetAngle%(Math.PI*2);

    if(target<0)
        target+=Math.PI*2;


    let difference=
        target-current;

    if(difference<0)
        difference+=Math.PI*2;


    const extra=
        Math.PI*2*
        (6+Math.floor(Math.random()*3));


    const startRotation=rotation;

    const finalRotation=
        rotation+
        extra+
        difference;


    const duration=4000;

    const startTime=
        performance.now();


    function animate(now){

        const progress=
            Math.min(
                (now-startTime)/duration,
                1
            );


        const ease=
            1-Math.pow(1-progress,4);


        rotation=
            startRotation+
            (finalRotation-startRotation)
            *ease;


        drawWheel();


        if(progress<1){

            requestAnimationFrame(animate);

        }else{

            rotation=finalRotation;

            drawWheel();

            spinning=false;

            document
            .getElementById("spinButton")
            .disabled=false;


            selectPlayer(winner);

        }

    }


    requestAnimationFrame(animate);
}


/* =========================
   اللاعب المختار
========================= */

function selectPlayer(index){

    selectedPlayerIndex=index;


    document
    .getElementById("currentPlayer")
    .textContent=
    players[index].name;


    document
    .getElementById("selectedPlayer")
    .textContent=
    "🎯 اللاعب المختار: "+
    players[index].name;


    updatePlayers();


    /*
       بعد اختيار اللاعب
       يطلع له تحدي من النوع المحدد
    */

    setTimeout(()=>{

        showQuestion();

    },500);
}


/* =========================
   اختيار نوع السؤال
========================= */

function getRandomType(){

    if(selectedType!=="ALL")
        return selectedType;


    const types=
        Object.keys(categories);


    return types[
        Math.floor(
            Math.random()*types.length
        )
    ];
}


/* =========================
   إظهار السؤال
========================= */

function showQuestion(){

    const type=getRandomType();

    currentQuestionType=type;


    const question=
        getQuestion(type);


    document
    .getElementById("questionCategory")
    .textContent=
    categories[type].name;


    document
    .getElementById("question")
    .textContent=
    question;


    document
    .getElementById("questionBox")
    .classList.remove("hidden");


    if(type==="FAST"){

        startTimer();

    }else{

        document
        .getElementById("timer")
        .classList.add("hidden");

    }
}


/* =========================
   سؤال بدون تكرار
========================= */

function getQuestion(type){

    if(!usedQuestions[type])
        usedQuestions[type]=[];


    if(
        usedQuestions[type].length>=
        challenges[type].length
    ){

        usedQuestions[type]=[];

    }


    let index;

    do{

        index=
        Math.floor(
            Math.random()*
            challenges[type].length
        );

    }while(
        usedQuestions[type].includes(index)
    );


    usedQuestions[type].push(index);


    return challenges[type][index];
}


/* =========================
   مؤقت 10 ثواني
========================= */

function startTimer(){

    clearInterval(timerInterval);


    const timer=
        document.getElementById("timer");


    timer.classList.remove("hidden");


    let time=10;

    timer.textContent=time;


    timerInterval=
    setInterval(()=>{

        time--;

        timer.textContent=time;


        if(time<=0){

            clearInterval(timerInterval);

            timer.textContent="⏰ انتهى الوقت";

        }

    },1000);
}


/* =========================
   نجاح
========================= */

function success(){

    clearInterval(timerInterval);


    if(selectedPlayerIndex>=0){

        players[selectedPlayerIndex].score++;

    }


    nextRound();
}


/* =========================
   فشل
========================= */

function failed(){

    clearInterval(timerInterval);

    nextRound();
}


/* =========================
   الجولة التالية
========================= */

function nextRound(){

    document
    .getElementById("questionBox")
    .classList.add("hidden");


    document
    .getElementById("timer")
    .classList.add("hidden");


    document
    .getElementById("selectedPlayer")
    .textContent=
    "لف العجلة لاختيار اللاعب";


    selectedPlayerIndex=-1;


    document
    .getElementById("currentPlayer")
    .textContent="-";


    updatePlayers();
}


/* =========================
   تحديث اللاعبين
========================= */

function updatePlayers(){

    const box=
        document.getElementById("players");

    box.innerHTML="";


    players.forEach((player,index)=>{

        const div=
            document.createElement("div");

        div.className="player";


        if(index===selectedPlayerIndex){

            div.classList.add("active");

        }


        div.textContent=
            player.name+
            " — "+
            player.score+
            " نقطة";


        box.appendChild(div);

    });


    updateLeaderboard();
}


/* =========================
   الترتيب
========================= */

function updateLeaderboard(){

    const board=
        document.getElementById("leaderboard");


    const sorted=
        [...players].sort(
            (a,b)=>b.score-a.score
        );


    board.innerHTML="";


    sorted.forEach((player,index)=>{

        const row=
            document.createElement("div");

        row.className="leader";


        row.innerHTML=
        `
        <span>
            ${index+1}. ${escapeHtml(player.name)}
        </span>

        <strong>
            ${player.score} نقطة
        </strong>
        `;


        board.appendChild(row);

    });
}


/* =========================
   الرجوع لاختيار النوع
========================= */

function backToSetup(){

    clearInterval(timerInterval);

    spinning=false;


    document
    .getElementById("game")
    .classList.add("hidden");


    document
    .getElementById("setup")
    .classList.remove("hidden");


    document
    .getElementById("questionBox")
    .classList.add("hidden");


    selectedPlayerIndex=-1;

    rotation=0;
}


/* =========================
   حماية الأسماء
========================= */

function escapeHtml(text){

    return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
