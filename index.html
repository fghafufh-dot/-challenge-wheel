<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎡 عجلة التحديات</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#111827,#312e81,#7c3aed);
    color:#fff;
    padding:15px;
}

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    padding:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.hidden{
    display:none!important;
}

h1{
    text-align:center;
    font-size:36px;
    margin:5px 0 25px;
}

label{
    display:block;
    margin:12px 0 7px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    font-size:17px;
    outline:none;
}

.playersInputs{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.typeButtons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

button{
    border:0;
    border-radius:14px;
    padding:13px 18px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.typeBtn{
    background:#374151;
    color:#fff;
}

.typeBtn.active{
    background:#f59e0b;
    color:#111;
}

.startBtn{
    width:100%;
    margin-top:20px;
    background:#22c55e;
    color:#fff;
}

.game{
    position:relative;
}

.backBtn{
    position:absolute;
    top:15px;
    right:15px;
    background:#ef4444;
    color:#fff;
}

.gameTitle{
    text-align:center;
    margin-top:5px;
}

.selectedPlayer{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#fbbf24;
    margin:12px 0;
}

.scoreBoard{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin:15px 0;
}

.score{
    background:rgba(255,255,255,.15);
    padding:8px 13px;
    border-radius:10px;
}

.wheelArea{
    position:relative;
    width:min(88vw,600px);
    aspect-ratio:1;
    margin:15px auto;
}

#wheel{
    width:100%;
    height:100%;
    display:block;
}

/* السهم ثابت في المنتصف */
.pointer{
    position:absolute;
    left:50%;
    top:50%;
    width:0;
    height:0;
    z-index:10;
}

/* جسم السهم */
.pointerLine{
    position:absolute;
    width:8px;
    height:145px;
    background:#ef4444;
    border-radius:10px;
    left:-4px;
    top:-145px;
    box-shadow:0 0 8px rgba(0,0,0,.5);
}

/* رأس مثلث واضح */
.pointerHead{
    position:absolute;
    left:-20px;
    top:-178px;
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-bottom:35px solid #ef4444;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
}

/* مركز السهم */
.pointerCenter{
    position:absolute;
    width:30px;
    height:30px;
    left:-15px;
    top:-15px;
    background:#fff;
    border:6px solid #ef4444;
    border-radius:50%;
    z-index:11;
}

.spinBtn{
    display:block;
    margin:10px auto;
    background:#f59e0b;
    color:#111;
    font-size:22px;
    padding:15px 35px;
}

.questionBox{
    text-align:center;
    margin-top:20px;
}

.categoryTitle{
    font-size:21px;
    color:#fbbf24;
    font-weight:bold;
}

.question{
    font-size:25px;
    font-weight:bold;
    line-height:1.6;
    margin:15px 0;
}

.timer{
    font-size:35px;
    font-weight:bold;
    color:#f87171;
    min-height:42px;
}

.answerButtons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.successBtn{
    background:#22c55e;
    color:#fff;
}

.failBtn{
    background:#ef4444;
    color:#fff;
}

.footer{
    text-align:center;
    margin-top:25px;
    opacity:.8;
    font-size:14px;
}

@media(max-width:600px){

    body{
        padding:8px;
    }

    .card{
        padding:15px;
    }

    h1{
        font-size:28px;
    }

    .playersInputs{
        grid-template-columns:1fr;
    }

    .typeButtons{
        grid-template-columns:repeat(2,1fr);
    }

    .selectedPlayer{
        font-size:22px;
    }

    .question{
        font-size:20px;
    }

    .pointerLine{
        height:105px;
        top:-105px;
    }

    .pointerHead{
        top:-138px;
    }
}
</style>
</head>

</div>

<label>أسماء اللاعبين</label>

<!-- ================= شاشة اللعبة ================= -->

<div id="game" class="card hidden">

</div>

<div id="scoreBoard" class="scoreBoard"></div>


<!-- ================= العجلة ================= -->

<div class="wheelArea">

<canvas id="wheel"></canvas>

<!-- السهم ثابت -->
<div class="pointer">

<div class="pointerLine"></div>

<div class="pointerHead"></div>

<div class="pointerCenter"></div>

</div>

</div>


<button id="spinBtn"
class="spinBtn"
onclick="spinWheel()">

🎡 لف العجلة

</button>


<!-- ================= التحدي ================= -->

<div id="questionBox" class="questionBox hidden">

<div id="categoryTitle"
class="categoryTitle">
</div>

<div id="question"
class="question">
</div>

<div id="timer"

<div class="answerButtons">

<button class="successBtn"

<button class="failBtn"

❌ فشل

</div>

</div>


<div class="footer">
المصمم عادل الشمري
</div>

</div>

</div>

/* =====================================================
   إنشاء خانات اللاعبين
===================================================== */

function createPlayerInputs(){

    const count=
        Number(document.getElementById("playerCount").value);

    const box=
        document.getElementById("playersInputs");

    box.innerHTML="";

    for(let i=0;i<count;i++){

        const input=document.createElement("input");

        input.id="player"+i;

        input.placeholder=
            "اسم اللاعب "+(i+1);

        box.appendChild(input);
    }
}

createPlayerInputs();


/* =====================================================
   اختيار نوع التحدي
===================================================== */

function chooseType(type,button){

    selectedType=type;

    document
    .querySelectorAll(".typeBtn")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");
}


/* =====================================================
   بدء اللعبة
===================================================== */

function startGame(){

    const count=
        Number(document.getElementById("playerCount").value);

    players=[];
    scores=[];

    for(let i=0;i<count;i++){

        let name=
            document.getElementById("player"+i)
            .value.trim();

        if(!name){
            name="لاعب "+(i+1);
        }

        players.push(name);
        scores.push(0);
    }

    wheelRotation=0;
    spinning=false;

    document
    .getElementById("setup")
    .classList.add("hidden");

    document
    .getElementById("game")
    .classList.remove("hidden");

    document
    .getElementById("selectedPlayer")
    .textContent=
    "لف العجلة لاختيار اللاعب 🎯";

    document
    .getElementById("questionBox")
    .classList.add("hidden");

    drawWheel();

    updateScores();
}


/* =====================================================
   رسم العجلة
===================================================== */

function drawWheel(){

    const canvas=
        document.getElementById("wheel");

    const area=
        document.querySelector(".wheelArea");

    const size=
        area.clientWidth;

    canvas.width=size;
    canvas.height=size;

    const ctx=
        canvas.getContext("2d");

    const center=size/2;

    const radius=size/2-7;

    const count=players.length;

    const slice=
        (Math.PI*2)/count;

    const colors=[
        "#ef4444",
        "#3b82f6",
        "#22c55e",
        "#f59e0b",
        "#8b5cf6",
        "#ec4899",
        "#14b8a6",
        "#f97316",
        "#06b6d4",
        "#84cc16",
        "#e11d48",
        "#6366f1"
    ];

    ctx.clearRect(0,0,size,size);

    for(let i=0;i<count;i++){

        const start=
            i*slice;

        const end=
            start+slice;

        ctx.beginPath();

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle=
            colors[i%colors.length];

        ctx.fill();

        ctx.strokeStyle="#fff";
        ctx.lineWidth=4;

        ctx.stroke();


        /* اسم اللاعب */

        ctx.save();

        ctx.translate(center,center);

        ctx.rotate(
            start+slice/2
        );

        ctx.textAlign="right";
        ctx.textBaseline="middle";

        ctx.fillStyle="#fff";

        ctx.font=
            `bold ${Math.max(14,size/30)}px Arial`;

        ctx.fillText(
            players[i],
            radius-20,
            0
        );

        ctx.restore();
    }


    /* دائرة المركز */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        36,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#111827";

    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth=4;

    ctx.stroke();
}


/* =====================================================
   لف العجلة
===================================================== */

function spinWheel(){

    if(spinning) return;

    spinning=true;

    clearInterval(timerInterval);

    document
    .getElementById("questionBox")
    .classList.add("hidden");

    document
    .getElementById("spinBtn")
    .disabled=true;


    /*
       نختار لاعباً عشوائياً.
       لكن الذي يدور فعلياً هو العجلة.
    */

    selectedPlayerIndex=
        Math.floor(
            Math.random()*players.length
        );


    const count=players.length;

    const slice=360/count;


    /*
       رأس السهم ثابت في الأعلى.
       نحسب مكان اللاعب ثم ندور العجلة
       حتى يصبح اللاعب تحت رأس السهم.
    */

    const playerAngle=
        selectedPlayerIndex*slice+
        slice/2;


    const extraSpins=
        360*6;


    const target=
        extraSpins+
        (360-playerAngle);


    wheelRotation+=target;


    const canvas=
        document.getElementById("wheel");


    /*
       العجلة نفسها تدور
    */

    canvas.style.transition=
        "transform 4s cubic-bezier(.12,.72,.15,1)";

    canvas.style.transform=
        `rotate(${wheelRotation}deg)`;


    setTimeout(()=>{

        spinning=false;

        showSelectedPlayer();

    },4100);
}


/* =====================================================
   إظهار اللاعب الذي وقفت عليه العجلة
===================================================== */

function showSelectedPlayer(){

    const name=
        players[selectedPlayerIndex];


    document
    .getElementById("selectedPlayer")
    .textContent=
    "🎯 تحدي "+name;


    showQuestion();
}


/* =====================================================
   اختيار السؤال
===================================================== */

function getQuestion(){

    let category;

    if(selectedType==="ALL"){

        const types=[
            "FUN",
            "SMART",
            "ACT",
            "FAST",
            "BOLD",
            "CHALLENGE"
        ];

        category=
            types[
                Math.floor(
                    Math.random()*types.length
                )
            ];

    }else{

        category=selectedType;

    }


    const list=
        QUESTIONS[category];


    const question=
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];


    return{
        category,
        question
    };
}


/* =====================================================
   عرض التحدي
===================================================== */

function showQuestion(){

    const data=
        getQuestion();


    document
    .getElementById("categoryTitle")
    .textContent=
        categoryName(data.category);


    document
    .getElementById("question")
    .textContent=
        data.question;


    document
    .getElementById("questionBox")
    .classList.remove("hidden");


    if(data.category==="FAST"){

        startTimer();

    }else{

        document
        .getElementById("timer")
        .textContent="";
    }
}


/* =====================================================
   أسماء الأقسام
===================================================== */

function categoryName(type){

    const names={

        FUN:"😂 تحدي مضحك",

        SMART:"🧠 تحدي ذكاء",

        ACT:"🎭 تحدي تمثيل",

        FAST:"⚡ تحدي سرعة — 10 ثواني",

        BOLD:"🔥 تحدي جريء",

        CHALLENGE:"🏆 تحدي"

    };

    return names[type];
}


/* =====================================================
   المؤقت
===================================================== */

function startTimer(){

    clearInterval(timerInterval);

    let time=10;

    const timer=
        document.getElementById("timer");

    timer.textContent=
        "⏱️ "+time;


    timerInterval=
        setInterval(()=>{

            time--;

            timer.textContent=
                "⏱️ "+time;


            if(time<=0){

                clearInterval(timerInterval);

                timer.textContent=
                    "⏰ انتهى الوقت";

            }

        },1000);
}


/* =====================================================
   نجاح التحدي
===================================================== */

function success(){

    clearInterval(timerInterval);

    scores[selectedPlayerIndex]++;

    updateScores();

    nextRound();
}


/* =====================================================
   فشل التحدي
===================================================== */

function failed(){

    clearInterval(timerInterval);

    nextRound();
}


/* =====================================================
   الجولة التالية
===================================================== */

function nextRound(){

    document
    .getElementById("questionBox")
    .classList.add("hidden");


    document
    .getElementById("selectedPlayer")
    .textContent=
        "لف العجلة لاختيار لاعب جديد 🎯";


    document
    .getElementById("spinBtn")
    .disabled=false;
}


/* =====================================================
   النتائج
===================================================== */

function updateScores(){

    const board=
        document.getElementById("scoreBoard");

    board.innerHTML="";


    players.forEach((name,index)=>{

        const div=
            document.createElement("div");

        div.className="score";

        div.textContent=
            name+": "+scores[index]+" 🏆";

        board.appendChild(div);

    });
}


/* =====================================================
   الرجوع
===================================================== */

function backToSetup(){

    clearInterval(timerInterval);

    document
    .getElementById("game")
    .classList.add("hidden");

    document
    .getElementById("setup")
    .classList.remove("hidden");
}


/* =====================================================
   تحديث حجم العجلة
===================================================== */

window.addEventListener("resize",()=>{

    if(
        !document
        .getElementById("game")
        .classList
        .contains("hidden")
    ){

        drawWheel();

    }

});

</script>
