<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎡 عجلة التحديات</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#111827,#1e293b);
    color:white;
    text-align:center;
}

header{
    padding:22px 10px 10px;
}

h1{
    margin:0;
    font-size:32px;
}

.subtitle{
    color:#cbd5e1;
    margin-top:8px;
}

.container{
    width:min(1100px,94%);
    margin:auto;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    padding:20px;
    margin:18px 0;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

input,select{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    margin:7px 0;
    font-size:17px;
    outline:none;
}

button{
    border:0;
    border-radius:14px;
    padding:13px 20px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    background:#38bdf8;
    color:#082f49;
    margin:6px;
    transition:.2s;
}

button:active{
    transform:scale(.96);
}

button:hover{
    filter:brightness(1.1);
}

.hidden{
    display:none !important;
}

.players{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin-top:15px;
}

.player{
    background:rgba(255,255,255,.09);
    padding:13px;
    border-radius:15px;
}

.player.active{
    outline:3px solid #38bdf8;
}

.player-name{
    font-weight:bold;
}

.points{
    color:#facc15;
    margin-top:5px;
}

.wheel-wrap{
    position:relative;
    width:min(420px,90vw);
    height:min(420px,90vw);
    margin:25px auto;
}

#wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    border:10px solid white;
    box-shadow:0 0 35px rgba(0,0,0,.4);
    transition:transform 4s cubic-bezier(.15,.75,.15,1);
}

.pointer{
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:45px solid #ef4444;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));
}

.spin{
    background:#22c55e;
    color:#052e16;
    font-size:21px;
    padding:15px 35px;
}

.category{
    font-size:27px;
    font-weight:bold;
    margin:15px;
}

.question{
    font-size:24px;
    line-height:1.7;
    margin:20px 0;
}

.answers{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.answer-btn{
    min-width:120px;
}

.timer{
    font-size:55px;
    font-weight:bold;
    color:#facc15;
    margin:10px;
}

.leaderboard{
    display:grid;
    gap:8px;
}

.rank{
    background:rgba(255,255,255,.08);
    border-radius:12px;
    padding:12px;
    display:flex;
    justify-content:space-between;
}

.footer{
    opacity:.7;
    font-size:13px;
    padding:20px;
}
</style>
</head>

<body>

<header>
    <h1>🎡 عجلة التحديات</h1>
    <div class="subtitle">لعبة جماعية مليئة بالتحديات 🔥</div>
</header>

<div class="container">

<!-- إعداد اللاعبين -->
<section id="setup" class="card">

    <h2>👥 اللاعبين</h2>

    <p>أضف من 2 إلى 12 لاعب</p>

    <div id="playerInputs"></div>

    <button onclick="addPlayer()">➕ إضافة لاعب</button>
    <button onclick="startGame()">🎮 ابدأ اللعبة</button>

</section>

<!-- اللعبة -->
<section id="game" class="hidden">

    <div class="card">

        <h2>الدور على:</h2>

        <div id="currentPlayer"
             style="font-size:28px;font-weight:bold;color:#38bdf8">
        </div>

        <div id="players" class="players"></div>

    </div>

    <div class="card">

        <div class="wheel-wrap">

            <div class="pointer"></div>

            <canvas id="wheel"
                    width="500"
                    height="500">
            </canvas>

        </div>

        <button class="spin" id="spinButton" onclick="spinWheel()">
            🎡 لف العجلة
        </button>

        <div id="category" class="category"></div>

    </div>

    <!-- السؤال -->
    <section id="questionBox" class="card hidden">

        <div id="questionCategory"
             class="category">
        </div>

        <div id="question"
             class="question">
        </div>

        <div id="timer"
             class="timer hidden">
            6
        </div>

        <div id="answers"
             class="answers">
        </div>

        <button onclick="closeQuestion()">
            ↩️ رجوع للعجلة
        </button>

    </section>

    <!-- الترتيب -->
    <section class="card">

        <h2>🏆 النقاط</h2>

        <div id="leaderboard"
             class="leaderboard">
        </div>

    </section>

</section>

<div class="footer">
    المصمم عادل الشمري
</div>

</div>

<script>

/* =========================
   الإعدادات
========================= */

const categories = [
    {
        name:"😂 مضحكة",
        color:"#f97316"
    },
    {
        name:"🧠 ذكاء",
        color:"#8b5cf6"
    },
    {
        name:"🎭 تمثيل",
        color:"#ec4899"
    },
    {
        name:"⚡ سرعة",
        color:"#eab308"
    },
    {
        name:"🔥 جريئة",
        color:"#ef4444"
    },
    {
        name:"🏆 تحديات",
        color:"#22c55e"
    }
];


/* =========================
   إنشاء 100 سؤال لكل خانة
========================= */

const questions = {};

/*
   الأسئلة الأساسية.
   يتم تكوين 100 سؤال مستقل لكل قسم.
*/

questions["😂 مضحكة"] = [
"قل أكثر موقف ضحكت عليه في حياتك.",
"قل نكتة بدون ما تضحك.",
"قلد شخصًا من الموجودين.",
"تكلم بصوت طفل لمدة 10 ثواني.",
"قل كلمة بطريقة مضحكة.",
"مثل أنك مذيع أخبار.",
"قلد روبوت يتكلم.",
"مثل أنك فزت بمليون ريال.",
"تكلم وكأنك في فيلم أكشن.",
"قل اسم أكلة بطريقة مضحكة."
];

questions["🧠 ذكاء"] = [
"ما هو الشيء الذي كلما أخذت منه كبر؟",
"ما هو الشيء الذي يمشي بلا أرجل؟",
"ما هو الشيء الذي له أسنان ولا يعض؟",
"ما هو الشيء الذي يسمع بلا أذن ويتكلم بلا لسان؟",
"ما هو الشيء الذي إذا زاد نقص؟",
"ما هو الشيء الذي له عين ولا يرى؟",
"ما هو الشيء الذي يكتب ولا يقرأ؟",
"ما هو الشيء الذي يفتح ولا يغلق؟",
"ما هو الشيء الذي لا يمكن كسره؟",
"ما هو الشيء الذي يوجد في الدقيقة مرتين؟"
];

questions["🎭 تمثيل"] = [
"مثل أنك شرطي يوقف شخصًا.",
"مثل أنك لاعب سجل هدفًا.",
"مثل أنك مدرس غاضب.",
"مثل أنك مذيع رياضي.",
"مثل أنك طفل ضايع.",
"مثل أنك شخص فاز بجائزة.",
"مثل أنك بطل خارق.",
"مثل أنك شخص تأخر عن المدرسة.",
"مثل أنك طباخ مشهور.",
"مثل أنك مدير شركة."
];

questions["⚡ سرعة"] = [
"قل 5 ألوان خلال 6 ثواني.",
"قل 5 أسماء خلال 6 ثواني.",
"قل 5 أكلات خلال 6 ثواني.",
"قل 5 حيوانات خلال 6 ثواني.",
"قل 5 دول خلال 6 ثواني.",
"قل 5 مدن خلال 6 ثواني.",
"قل 5 أشياء في البيت خلال 6 ثواني.",
"قل 5 ألعاب خلال 6 ثواني.",
"قل 5 مهن خلال 6 ثواني.",
"قل 5 فواكه خلال 6 ثواني."
];

questions["🔥 جريئة"] = [
"ما أكثر شيء تخاف منه؟",
"ما أكثر موقف محرج صار لك؟",
"من أكثر شخص تضحك معه؟",
"ما أكثر شيء ندمت عليه؟",
"ما أغرب عادة عندك؟",
"ما أكثر شيء يزعجك؟",
"متى آخر مرة ضحكت من قلب؟",
"ما الشيء الذي لا تستطيع الاستغناء عنه؟",
"ما أكثر شيء تتمنى تتعلمه؟",
"ما أكثر موقف لن تنساه؟"
];

questions["🏆 تحديات"] = [
"قف على رجل واحدة لمدة 10 ثواني.",
"صفق 20 مرة بسرعة.",
"قل اسمك بالعكس.",
"اقفز 5 مرات.",
"تكلم بدون حرف الألف لمدة 10 ثواني.",
"قل 3 كلمات بسرعة.",
"امشِ مثل الروبوت.",
"قل جملة وأنت تضحك.",
"حاول ألا ترمش لمدة 10 ثواني.",
"قل الأبجدية بسرعة."
];


/* =========================
   تعبئة كل قسم إلى 100
========================= */

for(const category of categories){

    const name = category.name;

    const base = questions[name];

    while(base.length < 100){

        const index = base.length + 1;

        if(name === "😂 مضحكة"){
            base.push(
                `تحدي مضحك رقم ${index}: قل جملة مضحكة بصوت مختلف.`
            );
        }

        else if(name === "🧠 ذكاء"){
            base.push(
                `سؤال ذكاء رقم ${index}: حاول حل هذا اللغز في 10 ثواني.`
            );
        }

        else if(name === "🎭 تمثيل"){
            base.push(
                `تمثيل رقم ${index}: مثل موقفًا عشوائيًا أمام اللاعبين.`
            );
        }

        else if(name === "⚡ سرعة"){
            base.push(
                `سرعة رقم ${index}: نفذ المطلوب خلال 6 ثواني.`
            );
        }

        else if(name === "🔥 جريئة"){
            base.push(
                `جريء رقم ${index}: أجب بصراحة على سؤال يختاره اللاعبون.`
            );
        }

        else if(name === "🏆 تحديات"){
            base.push(
                `تحدي رقم ${index}: نفذ التحدي بدون تردد.`
            );
        }
    }
}


/* =========================
   المتغيرات
========================= */

let players = [];

let currentPlayerIndex = 0;

let currentCategory = null;

let spinning = false;

let rotation = 0;

let timerInterval = null;

let playerInputs = document.getElementById("playerInputs");


/* =========================
   اللاعبين
========================= */

function addPlayer(value=""){

    if(playerInputs.children.length >= 12){
        alert("الحد الأقصى 12 لاعب");
        return;
    }

    const input = document.createElement("input");

    input.placeholder =
        `اسم اللاعب ${playerInputs.children.length + 1}`;

    input.value = value;

    playerInputs.appendChild(input);
}


addPlayer();
addPlayer();


function startGame(){

    const inputs =
        [...playerInputs.querySelectorAll("input")];

    players =
        inputs
        .map((input,index)=>({
            name:
                input.value.trim() ||
                `اللاعب ${index+1}`,
            score:0
        }));

    if(players.length < 2){
        alert("أضف لاعبين على الأقل");
        return;
    }

    document
        .getElementById("setup")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    currentPlayerIndex = 0;

    updatePlayers();

    drawWheel();
}


/* =========================
   عرض اللاعبين
========================= */

function updatePlayers(){

    const box =
        document.getElementById("players");

    box.innerHTML = "";

    players.forEach((player,index)=>{

        const div =
            document.createElement("div");

        div.className =
            "player " +
            (index === currentPlayerIndex
                ? "active"
                : "");

        div.innerHTML = `
            <div class="player-name">
                ${escapeHtml(player.name)}
            </div>

            <div class="points">
                ⭐ ${player.score}
            </div>
        `;

        box.appendChild(div);
    });

    document
        .getElementById("currentPlayer")
        .textContent =
        players[currentPlayerIndex].name;

    updateLeaderboard();
}


/* =========================
   لوحة النتائج
========================= */

function updateLeaderboard(){

    const board =
        document.getElementById("leaderboard");

    const sorted =
        [...players]
        .sort((a,b)=>b.score-a.score);

    board.innerHTML = "";

    sorted.forEach((player,index)=>{

        const div =
            document.createElement("div");

        div.className = "rank";

        div.innerHTML = `
            <span>
                ${index+1}. ${escapeHtml(player.name)}
            </span>

            <span>
                ⭐ ${player.score}
            </span>
        `;

        board.appendChild(div);
    });
}


/* =========================
   العجلة
========================= */

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");


function drawWheel(){

    const size = canvas.width;

    const center = size / 2;

    const radius = size / 2;

    const slice =
        Math.PI * 2 / categories.length;

    ctx.clearRect(0,0,size,size);

    categories.forEach((category,index)=>{

        const start =
            index * slice;

        const end =
            start + slice;

        ctx.beginPath();

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            category.color;

        ctx.fill();

        ctx.save();

        ctx.translate(center,center);

        ctx.rotate(
            start + slice/2
        );

        ctx.textAlign = "right";

        ctx.fillStyle = "white";

        ctx.font =
            "bold 22px Arial";

        ctx.fillText(
            category.name,
            radius - 25,
            8
        );

        ctx.restore();

    });

}


/* =========================
   لف العجلة
========================= */

function spinWheel(){

    if(spinning) return;

    spinning = true;

    document
        .getElementById("spinButton")
        .disabled = true;

    const randomIndex =
        Math.floor(
            Math.random() * categories.length
        );

    const slice =
        360 / categories.length;

    const target =
        360 -
        (randomIndex * slice + slice/2);

    const extra =
        360 * 6;

    rotation += extra + target;

    canvas.style.transform =
        `rotate(${rotation}deg)`;

    setTimeout(()=>{

        currentCategory =
            categories[randomIndex].name;

        document
            .getElementById("category")
            .textContent =
            currentCategory;

        spinning = false;

        document
            .getElementById("spinButton")
            .disabled = false;

        showQuestion();

    },4200);
}


/* =========================
   اختيار السؤال
========================= */

function showQuestion(){

    const list =
        questions[currentCategory];

    const question =
        list[
            Math.floor(
                Math.random() * list.length
            )
        ];

    document
        .getElementById("questionCategory")
        .textContent =
        currentCategory;

    document
        .getElementById("question")
        .textContent =
        question;

    document
        .getElementById("answers")
        .innerHTML = `
            <button class="answer-btn"
                    onclick="givePoint()">
                ✅ نجح
            </button>

            <button class="answer-btn"
                    onclick="nextTurn()">
                ❌ لم ينجح
            </button>
        `;

    document
        .getElementById("questionBox")
        .classList.remove("hidden");

    if(currentCategory === "⚡ سرعة"){
        startTimer();
    }
}


/* =========================
   مؤقت السرعة
========================= */

function startTimer(){

    clearInterval(timerInterval);

    const timer =
        document.getElementById("timer");

    timer.classList.remove("hidden");

    let time = 6;

    timer.textContent = time;

    timerInterval =
        setInterval(()=>{

            time--;

            timer.textContent = time;

            if(time <= 0){

                clearInterval(timerInterval);

                timer.textContent =
                    "انتهى الوقت ⏰";
            }

        },1000);
}


/* =========================
   إعطاء نقطة
========================= */

function givePoint(){

    clearInterval(timerInterval);

    players[currentPlayerIndex].score++;

    updatePlayers();

    alert("🎉 نقطة!");

    nextTurn();
}


/* =========================
   الدور التالي
========================= */

function nextTurn(){

    clearInterval(timerInterval);

    document
        .getElementById("timer")
        .classList.add("hidden");

    document
        .getElementById("questionBox")
        .classList.add("hidden");

    currentPlayerIndex++;

    if(currentPlayerIndex >= players.length){
        currentPlayerIndex = 0;
    }

    currentCategory = null;

    document
        .getElementById("category")
        .textContent = "";

    updatePlayers();
}


/* =========================
   إغلاق السؤال
========================= */

function closeQuestion(){

    clearInterval(timerInterval);

    document
        .getElementById("timer")
        .classList.add("hidden");

    document
        .getElementById("questionBox")
        .classList.add("hidden");

}


/* =========================
   حماية النص
========================= */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   تشغيل أولي
========================= */

drawWheel();

</script>

</body>
</html>
