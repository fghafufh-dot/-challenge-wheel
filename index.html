<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة التحديات</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#080611,#17102d,#080611);
  color:#fff;
}

button,input{font:inherit}

.app{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(900px,100%);
  background:rgba(18,14,35,.95);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:28px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.screen{
  display:none;
  animation:show .35s ease;
}

.screen.active{display:block}

@keyframes show{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

h1,h2{text-align:center}

h1{
  font-size:clamp(32px,7vw,58px);
  margin:5px 0 8px;
}

h2{
  font-size:clamp(25px,5vw,38px);
  margin:5px 0 12px;
}

.sub{
  text-align:center;
  color:#c7bfdc;
  margin-bottom:25px;
}

.creator{
  text-align:center;
  color:#a879e8;
  font-size:14px;
  font-weight:700;
  margin:0 0 28px;
}

.main-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  background:linear-gradient(135deg,#ffd84d,#ffb300);
  color:#17110b;
  font-weight:900;
  font-size:20px;
  cursor:pointer;
}

.main-btn:active{transform:scale(.98)}

.names{
  display:grid;
  gap:12px;
  margin-bottom:15px;
}

.name-row{
  display:flex;
  gap:8px;
}

.name-row span{
  width:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#cfc5e8;
  font-weight:bold;
}

input{
  width:100%;
  border:1px solid #453a5d;
  outline:none;
  background:#100c20;
  color:white;
  border-radius:13px;
  padding:14px;
}

input:focus{border-color:#9b5cff}

.add{
  width:100%;
  border:1px dashed #7654a5;
  background:#1d1630;
  color:#d9c9f7;
  border-radius:14px;
  padding:13px;
  cursor:pointer;
  margin-bottom:18px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.cat{
  border:1px solid #403653;
  background:#171128;
  color:white;
  border-radius:17px;
  padding:18px 10px;
  cursor:pointer;
  transition:.2s;
}

.cat.selected{
  background:linear-gradient(135deg,#4f247e,#7d3fc3);
  border-color:#b87cff;
  transform:translateY(-2px);
}

.cat b{
  display:block;
  font-size:19px;
  margin-bottom:5px;
}

.game-info{
  text-align:center;
  margin-bottom:10px;
}

.turn{color:#d4c5ed}

.turn strong{color:#ffd84d}

.wheel-wrap{
  position:relative;
  width:min(520px,90vw);
  aspect-ratio:1;
  margin:20px auto;
}

.wheel{
  position:absolute;
  inset:0;
  border-radius:50%;
  overflow:hidden;
  border:8px solid #241b39;
  box-shadow:0 0 0 2px #72569b,0 15px 45px rgba(0,0,0,.5);
  transition:transform 4.2s cubic-bezier(.12,.7,.12,1);
}

.segment{
  position:absolute;
  width:50%;
  height:50%;
  left:50%;
  top:50%;
  transform-origin:0 0;
}

.segment::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:0;
  height:0;
  border-top:1000px solid var(--c);
  border-right:1000px solid transparent;
}

.segment-name{
  position:absolute;
  z-index:2;
  left:55px;
  top:38px;
  width:115px;
  text-align:center;
  font-weight:900;
  font-size:clamp(13px,3vw,18px);
  color:white;
  text-shadow:0 2px 5px #000;
  pointer-events:none;
}

.pointer{
  position:absolute;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-100%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-bottom:48px solid #ffd84d;
  filter:drop-shadow(0 3px 5px #000);
}

.center{
  position:absolute;
  z-index:11;
  left:50%;
  top:50%;
  width:76px;
  height:76px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#161025;
  border:5px solid #ffd84d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 5px 20px rgba(0,0,0,.5);
}

.challenge{
  background:#171128;
  border:1px solid #403653;
  border-radius:20px;
  padding:20px;
  text-align:center;
  margin-top:15px;
}

.challenge-title{
  color:#b98aff;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

.challenge-text{
  font-size:20px;
  font-weight:800;
  line-height:1.6;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.done{
  background:#36c878;
  color:#061b10;
}

.skip{
  background:#5b536c;
  color:white;
}

.score-list{
  display:grid;
  gap:10px;
  margin:20px 0;
}

.score{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#171128;
  border:1px solid #403653;
  padding:15px;
  border-radius:15px;
}

.score:first-child{
  border-color:#ffd84d;
  box-shadow:0 0 18px rgba(255,216,77,.12);
}

.rank{
  color:#ffd84d;
  font-weight:900;
}

.winner{
  text-align:center;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(135deg,#392052,#1a1430);
  margin-bottom:20px;
}

.winner small{color:#c7bfdc}

.winner strong{
  display:block;
  color:#ffd84d;
  font-size:30px;
  margin-top:5px;
}

@media(max-width:600px){
  .card{
    padding:20px 15px;
    border-radius:22px;
  }

  .categories{
    grid-template-columns:1fr 1fr;
  }

  .segment-name{
    left:42px;
    top:27px;
    width:85px;
    font-size:12px;
  }

  .pointer{
    border-left-width:14px;
    border-right-width:14px;
    border-bottom-width:38px;
  }

  .center{
    width:65px;
    height:65px;
  }
}
</style>
</head>

<body>

<main class="app">
<div class="card">

<!-- الصفحة الأولى -->
<section id="s1" class="screen active">

  <h1>🎡 عجلة التحديات</h1>

  <p class="sub">
    لعبة جماعية سريعة وممتعة 🔥
  </p>

  <div class="creator">
    إنشاء وتصميم عادل
  </div>

  <button class="main-btn" onclick="go(2)">
    بدء اللعبة
  </button>

</section>


<!-- الأسماء -->
<section id="s2" class="screen">

  <h2>ضع الأسماء</h2>

  <p class="sub">
    أدخل أسماء اللاعبين
  </p>

  <div id="names" class="names"></div>

  <button class="add" onclick="addPlayer()">
    ＋ إضافة لاعب
  </button>

  <button class="main-btn" onclick="saveNames()">
    التالي
  </button>

</section>


<!-- أنواع التحديات -->
<section id="s3" class="screen">

  <h2>اختر نوع التحدي الي تبيه</h2>

  <p class="sub">
    تقدر تختار أكثر من نوع
  </p>

  <div id="cats" class="categories"></div>

  <button class="main-btn" onclick="startGame()">
    ابدأ التحدي 🔥
  </button>

</section>


<!-- اللعبة -->
<section id="s4" class="screen">

  <div class="game-info">
    <div class="turn">
      دور اللاعب:
      <strong id="turnName"></strong>
    </div>
  </div>

  <div class="wheel-wrap">

    <div id="wheel" class="wheel"></div>

    <div class="pointer"></div>

    <div class="center">
      🎯
    </div>

  </div>

  <button id="spin" class="main-btn" onclick="spin()">
    لف العجلة 🎡
  </button>

  <div id="challengeBox" class="challenge" style="display:none">

    <div class="challenge-title">
      التحدي
    </div>

    <div id="challengeText" class="challenge-text"></div>

    <div class="actions">

      <button class="main-btn done" onclick="completeChallenge()">
        تم ✅
      </button>

      <button class="main-btn skip" onclick="skipChallenge()">
        سكيب ⏭️
      </button>

    </div>

  </div>

</section>


<!-- النتائج -->
<section id="s5" class="screen">

  <h2>🏆 النتائج</h2>

  <div id="winner" class="winner"></div>

  <div id="scores" class="score-list"></div>

  <button class="main-btn" onclick="location.reload()">
    لعبة جديدة 🔄
  </button>

</section>

</div>
</main>


<script>

const data = {

"مضحكة 😂":[
"قل جملة بصوت روبوت لمدة 10 ثواني 🤖",
"مثّل أنك مذيع أخبار وتقول خبرًا مضحكًا 📺",
"قل نكتة بدون ما تضحك 😂",
"اعمل صوت حيوان وعلى الباقين تخمينه 🐯",
"تكلم كأنك طفل لمدة 15 ثانية 🧒",
"قل جملة عادية بطريقة درامية جدًا 🎭"
],

"ذكاء 🧠":[
"اذكر 5 أشياء تبدأ بحرف م خلال 5 ثواني 🧠",
"اذكر 5 مدن بسرعة 🌍",
"قل 7 ألوان بسرعة 🎨",
"قل 3 أمثال شعبية بسرعة",
"اذكر 4 أشياء موجودة في المطبخ خلال 5 ثواني 🍳",
"اذكر 5 حيوانات تبدأ بحرف أ 🐯"
],

"تمثيل 🎭":[
"مثّل شخصية كرتونية وعلى الباقين تخمينها 🎬",
"مثّل أنك فزت بمليون ريال 💰",
"مثّل أنك بائع وتحاول بيع شيء عشوائي 🛒",
"مثّل مشهد تأخرك عن موعد مهم ⏰",
"مثّل أنك لاعب مشهور والكل يحاول يعرف من أنت ⭐",
"مثّل أنك مذيع في مباراة نهائية 🎤"
],

"سرعة ⚡️":[
"قل 5 أكلات في 5 ثواني 🍕",
"قل 5 أسماء خلال 5 ثواني ⚡",
"قل كلمة صعبة 5 مرات بسرعة 😅",
"اذكر 5 أشياء لونها أبيض بسرعة ⚪",
"اذكر 5 أشياء تستخدمها يوميًا خلال 5 ثواني",
"قل أسماء 5 دول بأسرع ما تستطيع 🌍"
],

"جريئة 😈":[
"قل جملة وكأنك شخصية شريرة 😈",
"تكلم بلهجة مختلفة لمدة 20 ثانية 🗣️",
"قل اسمك وكأنك في فيلم أكشن 🎬",
"اعمل تمثالًا ثابتًا لمدة 15 ثانية 🗿",
"قل جملة عادية بصوت غامض جدًا 👀",
"تكلم لمدة 10 ثواني بدون استخدام كلمة نعم أو لا"
],

"تحديات 👥":[
"اختر لاعبًا وقل له 3 أشياء إيجابية عنه ⭐",
"صف لاعبًا بدون ذكر اسمه وعلى الباقين تخمينه 👀",
"اختر لاعبًا ليعطيك كلمة واستخدمها في جملة مضحكة 🎯",
"حاول ألا تضحك لمدة 10 ثواني 😂",
"اختر لاعبًا وقل له تحديًا بسيطًا وآمنًا لمدة 10 ثواني",
"اختر لاعبًا وقل له موقفًا مضحكًا حصل لك"
]

};

let players=[];
let scores=[];
let selectedCats=[];
let turn=0;
let rot=0;
let spinning=false;

const colors=[
"#7b35d1",
"#e14b7b",
"#1f9ed1",
"#e5a82f",
"#35b878",
"#d83d3d",
"#6946d9",
"#d95d31",
"#249b87",
"#9b43c8",
"#d49b26",
"#2878c8"
];

function go(n){

document.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

document.getElementById("s"+n)
.classList.add("active");

if(n===2)initNames();
if(n===3)initCats();

}


function initNames(){

const box=document.getElementById("names");

if(box.children.length)return;

for(let i=0;i<4;i++){
addPlayer();
}

}


function addPlayer(){

const box=document.getElementById("names");

if(box.children.length>=12){

alert("الحد الأقصى 12 لاعب");

return;
}

const i=box.children.length+1;

const row=document.createElement("div");

row.className="name-row";

row.innerHTML=`
<span>${i}-</span>
<input type="text" placeholder="اسم اللاعب ${i}">
`;

box.appendChild(row);

}


function saveNames(){

players=[...document.querySelectorAll("#names input")]
.map(x=>x.value.trim())
.filter(Boolean);

if(players.length<2){

alert("أدخل اسم لاعبين على الأقل");

return;
}

scores=players.map(()=>0);

turn=0;

go(3);

}


function initCats(){

const box=document.getElementById("cats");

if(box.children.length)return;

Object.keys(data).forEach(cat=>{

const button=document.createElement("button");

button.className="cat";

button.dataset.cat=cat;

button.innerHTML=`
<b>${cat}</b>
<span>اختيار</span>
`;

button.onclick=()=>{

button.classList.toggle("selected");

selectedCats=[
...document.querySelectorAll(".cat.selected")
].map(x=>x.dataset.cat);

};

box.appendChild(button);

});

}


function startGame(){

if(!selectedCats.length){

alert("اختر نوع تحدي واحد على الأقل");

return;
}

turn=0;

go(4);

drawWheel();

showTurn();

}


function drawWheel(){

const wheel=document.getElementById("wheel");

wheel.innerHTML="";

const n=players.length;

const angle=360/n;

players.forEach((name,i)=>{

const segment=document.createElement("div");

segment.className="segment";

segment.style.transform=
`rotate(${i*angle}deg) skewY(${90-angle}deg)`;

segment.style.setProperty(
"--c",
colors[i%colors.length]
);

const label=document.createElement("div");

label.className="segment-name";

label.textContent=name;

label.style.transform=
`skewY(${-(90-angle)}deg) rotate(${angle/2}deg)`;

segment.appendChild(label);

wheel.appendChild(segment);

});

}


function showTurn(){

document.getElementById("turnName")
.textContent=players[turn];

document.getElementById("challengeBox")
.style.display="none";

document.getElementById("spin")
.disabled=false;

}


function spin(){

if(spinning)return;

spinning=true;

const button=document.getElementById("spin");

button.disabled=true;

document.getElementById("challengeBox")
.style.display="none";

const n=players.length;

const selected=Math.floor(Math.random()*n);

const angle=360/n;

const target=
360-(selected*angle+angle/2);

const extra=360*5;

rot+=extra+target;

document.getElementById("wheel")
.style.transform=`rotate(${rot}deg)`;

setTimeout(()=>{

spinning=false;

document.getElementById("turnName")
.textContent=players[selected];

showChallenge(selected);

},4300);

}


function showChallenge(playerIndex){

const all=[];

selectedCats.forEach(cat=>{

data[cat].forEach(challenge=>{
all.push(challenge);
});

});

const challenge=
all[Math.floor(Math.random()*all.length)];

document.getElementById("challengeText")
.textContent=challenge;

document.getElementById("challengeBox")
.style.display="block";

document.getElementById("challengeBox")
.scrollIntoView({
behavior:"smooth",
block:"center"
});

window.currentPlayer=playerIndex;

}


function completeChallenge(){

scores[window.currentPlayer]++;

nextTurn();

}


function skipChallenge(){

nextTurn();

}


function nextTurn(){

turn++;

if(turn>=players.length){

showResults();

return;
}

showTurn();

}


function showResults(){

go(5);

const results=players
.map((name,i)=>({
name:name,
score:scores[i]
}))
.sort((a,b)=>b.score-a.score);

const winner=document.getElementById("winner");

winner.innerHTML=`
<small>الفائز 🏆</small>
<strong>${results[0].name}</strong>
<div>${results[0].score} نقطة</div>
`;

const box=document.getElementById("scores");

box.innerHTML="";

results.forEach((p,i)=>{

const row=document.createElement("div");

row.className="score";

row.innerHTML=`
<span>
<span class="rank">#${i+1}</span>
&nbsp; ${p.name}
</span>

<strong>${p.score} نقطة</strong>
`;

box.appendChild(row);

});

}

</script>

</body>
</html>
