<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 عجلة التحديات</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    margin:0;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:20px 10px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:min(950px,94%);
    margin:auto;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.hidden{
    display:none !important;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    margin:6px 0;
    font-size:17px;
    background:white;
    color:#111;
}

button{
    border:none;
    border-radius:12px;
    padding:13px 18px;
    margin:5px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.96);
}

button:hover{
    transform:translateY(-2px);
}

.types{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:15px 0;
}

.type{
    padding:18px 10px;
    background:#1e293b;
    border:2px solid transparent;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    transition:.2s;
}

.type.selected{
    border-color:#38bdf8;
    background:#075985;
    transform:scale(1.02);
}

.start{
    width:100%;
    background:#22c55e;
    color:white;
    font-size:20px;
}

.add{
    background:#2563eb;
    color:white;
}

#game{
    position:relative;
}

#backButton{
    position:absolute;
    top:10px;
    right:10px;
    z-index:50;
    background:#ef4444;
    color:white;
    padding:10px 15px;
}

.current{
    text-align:center;
    font-size:28px;
    color:#38bdf8;
    font-weight:bold;
}

.players{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:15px;
}

.player{
    background:#334155;
    padding:10px 15px;
    border-radius:12px;
}

.player.active{
    background:#0284c7;
    box-shadow:0 0 15px rgba(56,189,248,.5);
}

.wheelWrap{
    width:min(500px,90vw);
    aspect-ratio:1;
    margin:20px auto;
    position:relative;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:38px solid #ef4444;
    filter:drop-shadow(0 3px 3px black);
}

.spin{
    display:block;
    width:min(400px,90%);
    margin:15px auto;
    background:#f59e0b;
    color:white;
    font-size:22px;
}

.category{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin:15px;
    color:#38bdf8;
}

.question{
    text-align:center;
    font-size:25px;
    line-height:1.7;
    background:rgba(0,0,0,.2);
    border-radius:15px;
    padding:20px;
    min-height:90px;
}

.answers{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:15px;
}

.answers button{
    min-width:140px;
}

.success{
    background:#22c55e;
    color:white;
}

.fail{
    background:#ef4444;
    color:white;
}

.timer{
    width:75px;
    height:75px;
    margin:20px auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ef4444;
    font-size:25px;
    font-weight:bold;
}

.leader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1e293b;
    padding:12px 15px;
    border-radius:12px;
    margin:7px 0;
}

.footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
    font-size:15px;
}

@media(max-width:600px){

    header{
        font-size:24px;
    }

    .types{
        grid-template-columns:1fr;
    }

    .type{
        padding:15px;
    }

    .question{
        font-size:20px;
    }

    .current{
        font-size:23px;
    }

    #backButton{
        position:relative;
        top:auto;
        right:auto;
        width:100%;
        margin-bottom:10px;
    }
}
</style>
</head>

<body>

<header>🎡 عجلة التحديات</header>

<div class="container">

<!-- الإعداد -->
<div id="setup" class="card">

    <h2>👥 أسماء اللاعبين</h2>

    <div id="playerInputs"></div>

    <button class="add" onclick="addPlayer()">➕ إضافة لاعب</button>

    <hr>

    <h2>🎯 اختر نوع التحديات</h2>

    <div class="types">

            🎲 كل الأنواع
        </div>

        <div class="type"

            😂 مضحكة
        </div>

            🧠 ذكاء
        </div>

            🎭 تمثيل

            ⚡ سرعة
        </div>

        <div class="type"
             onclick="chooseType(this,'BOLD')">
            🔥 جريئة
        </div>

        <div class="type"
             onclick="chooseType(this,'CHALLENGE')">
            🏆 تحديات
        </div>

    </div>

    <button class="start" onclick="startGame()">
        🎮 ابدأ اللعبة
    </button>

</div>


<!-- اللعبة -->
<div id="game" class="hidden">

    <button id="backButton" onclick="backToTypeSelection()">
        ↩️ رجوع
    </button>

    <div class="card">

        <h2>🎮 الدور على</h2>

        <div id="currentPlayer" class="current"></div>

        <div id="players" class="players"></div>

    </div>


    <div class="card">

        <div class="wheelWrap">

            <canvas id="wheel"

            </canvas>

        </div>

        <button id="spinButton"

        </button>

        <div id="category" class="category"></div>

    </div>


    <div id="questionBox" class="card hidden">

        <div id="questionCategory"
             class="category">
        </div>

        <div id="question"
             class="question">
        </div>

        <div id="timer"
             class="timer hidden">
            10
        </div>

        <div class="answers">

            <button class="success"

                ✅ نجح
            </button>

            <button class="fail"
                    onclick="failed()">
                ❌ لم ينجح
            </button>

        </div>

    </div>


    <div class="card">

        <h2>🏆 النقاط</h2>

        <div id="leaderboard"></div>

    </div>

</div>

<div class="footer">
    المصمم عادل الشمري
</div>

</div>

        document.getElementById("playerInputs");

        document.createElement("input");

        "اسم اللاعب " + (box.children.length + 1);

    box.appendChild(input);

========================= */

function chooseType(element,type){

    selectedType = type;

    document
        .querySelectorAll(".type")
        .forEach(item=>{
            item.classList.remove("selected");
        });

    element.classList.add("selected");

}


/* =========================
   بدء اللعبة
========================= */

function startGame(){

    const inputs =
        document.querySelectorAll(
            "#playerInputs input"
        );

    players = [];

    inputs.forEach(input=>{

        const name =
            input.value.trim();

        if(name){

            players.push({
                name:name,
                score:0
            });

        }

    });


    if(players.length < 1){

        alert("اكتب اسم لاعب واحد على الأقل");

        return;
    }


    currentPlayerIndex = 0;

    usedQuestions = {};

    Object.keys(challenges).forEach(type=>{
        usedQuestions[type] = [];
    });


    document
        .getElementById("setup")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");


    updatePlayers();

    drawWheel();

}


/* =========================
   أنواع العجلة
========================= */

function getWheelCategories(){

    if(selectedType === "ALL"){

        return Object.keys(categories);

    }

    return [selectedType];

}


/* =========================
   رسم العجلة
========================= */

function drawWheel(){

    const canvas =
        document.getElementById("wheel");

    const ctx =
        canvas.getContext("2d");

    const center =
        canvas.width / 2;

    const radius =
        center - 10;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const list =
        getWheelCategories();

    const slice =
        Math.PI * 2 / list.length;


    list.forEach((type,index)=>{

        const start =
            rotation + index * slice;

        const end =
            start + slice;


        ctx.beginPath();

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            categories[type].color;

        ctx.fill();


        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 3;

        ctx.stroke();


        ctx.save();

        ctx.translate(center,center);

        ctx.rotate(
            start + slice/2
        );

        ctx.textAlign = "right";

        ctx.fillStyle = "#111827";

        ctx.font =
            "bold 20px Arial";

        ctx.fillText(
            categories[type].name,
            radius - 20,
            7
        );

        ctx.restore();

    });


    ctx.beginPath();

    ctx.arc(
        center,
        center,
        55,
        0,
        Math.PI*2
    );

    ctx.fillStyle = "#0f172a";

    ctx.fill();

    ctx.strokeStyle = "#fff";

    ctx.lineWidth = 4;

    ctx.stroke();


    ctx.fillStyle = "#fff";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.font = "bold 18px Arial";

    ctx.fillText(
        "🎡",
        center,
        center
    );

}


/* =========================
   لف العجلة
========================= */

function spinWheel(){

    if(spinning) return;

    spinning = true;

    clearInterval(timerInterval);


    document
        .getElementById("questionBox")
        .classList.add("hidden");


    const spinButton =
        document.getElementById("spinButton");

    spinButton.disabled = true;


    const list =
        getWheelCategories();


    const selected =
        list[
            Math.floor(
                Math.random()*list.length
            )
        ];


    const extra =
        Math.PI * 2 *
        (5 + Math.random()*4);


    rotation += extra;


    const duration = 3000;

    const startRotation =
        rotation - extra;

    const startTime =
        performance.now();


    function animate(now){

        const progress =
            Math.min(
                (now-startTime)/duration,
                1
            );


        const ease =
            1-Math.pow(1-progress,4);


        rotation =
            startRotation +
            extra*ease;


        drawWheel();


        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            spinning = false;

            spinButton.disabled = false;

            showChallenge(selected);

        }

    }


    requestAnimationFrame(animate);

}


/* =========================
   إظهار السؤال
========================= */

function showChallenge(type){

    currentCategory = type;


    document
        .getElementById("category")
        .textContent =
        categories[type].name;


    document
        .getElementById("questionCategory")
        .textContent =
        categories[type].name;


    const question =
        getQuestion(type);


    document
        .getElementById("question")
        .textContent =
        question;


    document
        .getElementById("questionBox")
        .classList.remove("hidden");


    if(type === "FAST"){

        startTimer();

    }else{

        document
            .getElementById("timer")
            .classList.add("hidden");

    }

}


/* =========================
   اختيار سؤال بدون تكرار
========================= */

function getQuestion(type){

    if(!usedQuestions[type]){

        usedQuestions[type] = [];

    }


    if(
        usedQuestions[type].length >=
        challenges[type].length
    ){

        usedQuestions[type] = [];

    }


    let index;


    do{

        index =
            Math.floor(
                Math.random() *
                challenges[type].length
            );

    }while(
        usedQuestions[type].includes(index)
    );


    usedQuestions[type].push(index);


    return challenges[type][index];

}


/* =========================
   مؤقت السرعة 10 ثواني
========================= */

function startTimer(){

    clearInterval(timerInterval);


    const timer =
        document.getElementById("timer");


    timer.classList.remove("hidden");


    let time = 10;

    timer.textContent = time;


    timerInterval =
        setInterval(()=>{

            time--;

            timer.textContent = time;


            if(time <= 0){

                clearInterval(timerInterval);

                timer.textContent =
                    "⏰ انتهى";

            }

        },1000);

}


/* =========================
   نجح
========================= */

function success(){

    clearInterval(timerInterval);


    players[currentPlayerIndex].score++;


    nextTurn();

}


/* =========================
   لم ينجح
========================= */

function failed(){

    clearInterval(timerInterval);

    nextTurn();

}


/* =========================
   الدور التالي
========================= */

function nextTurn(){

    document
        .getElementById("questionBox")
        .classList.add("hidden");


    document
        .getElementById("timer")
        .classList.add("hidden");


    document
        .getElementById("category")
        .textContent = "";


    currentCategory = null;


    currentPlayerIndex++;

    if(
        currentPlayerIndex >=
        players.length
    ){

        currentPlayerIndex = 0;

    }


    updatePlayers();

}


/* =========================
   تحديث اللاعبين
========================= */

function updatePlayers(){

    const current =
        document.getElementById(
            "currentPlayer"
        );


    current.textContent =
        players[currentPlayerIndex].name;


    const box =
        document.getElementById("players");


    box.innerHTML = "";


    players.forEach((player,index)=>{

        const div =
            document.createElement("div");


        div.className =
            "player" +
            (
                index === currentPlayerIndex
                ? " active"
                : ""
            );


        div.textContent =
            player.name;


        box.appendChild(div);

    });


    updateLeaderboard();

}


/* =========================
   لوحة النقاط
========================= */

function updateLeaderboard(){

    const board =
        document.getElementById(
            "leaderboard"
        );


    const sorted =
        [...players].sort(
            (a,b)=>b.score-a.score
        );


    board.innerHTML = "";


    sorted.forEach((player,index)=>{

        const row =
            document.createElement("div");


        row.className =
            "leader";


        row.innerHTML = `
            <span>
                ${index+1}. ${escapeHtml(player.name)}
            </span>

            <strong>
                ${player.score} نقطة
            </strong>
        `;


        board.appendChild(row);

    });

}


/* =========================
   زر الرجوع
========================= */

function backToTypeSelection(){

    clearInterval(timerInterval);

    spinning = false;


    document
        .getElementById("questionBox")
        .classList.add("hidden");


    document
        .getElementById("timer")
        .classList.add("hidden");


    document
        .getElementById("game")
        .classList.add("hidden");


    document
        .getElementById("setup")
        .classList.remove("hidden");


    document
        .getElementById("category")
        .textContent = "";


    currentCategory = null;

    rotation = 0;

    drawWheel();

}


/* =========================
   حماية أسماء اللاعبين
========================= */

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
