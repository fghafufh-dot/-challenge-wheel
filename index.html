<script>

let players=[];
let selectedCategories=[];
let currentPlayer=0;
let currentChallenge=null;
let currentCategory=null;
let rotation=0;

let timerInterval=null;
let timeLeft=6;
let scores={};

let usedQuestions={};

/* =========================
   عدم تكرار الأسئلة
========================= */

function resetUsedQuestions(){

    usedQuestions={};

    selectedCategories.forEach(category=>{
        usedQuestions[category]=new Set();
    });
}

/* =========================
   صفحة اللاعبين
========================= */

function showPlayers(){

    document.getElementById("startPage").classList.add("hidden");
    document.getElementById("playersPage").classList.remove("hidden");

    if(!document.querySelector("#playersInputs input")){
        addPlayer();
        addPlayer();
    }
}

/* إضافة لاعب */

function addPlayer(){

    const box=document.getElementById("playersInputs");

    if(box.children.length>=12){

        alert("الحد الأقصى 12 لاعب");

        return;
    }

    const input=document.createElement("input");

    input.placeholder=
        `اسم اللاعب ${box.children.length+1}`;

    box.appendChild(input);
}

/* الانتقال لاختيار التحديات */

function goCategories(){

    const names=[
        ...document.querySelectorAll(
            "#playersInputs input"
        )
    ]
    .map(i=>i.value.trim())
    .filter(Boolean);

    if(names.length<2){

        alert("أدخل اسم لاعبين على الأقل");

        return;
    }

    players=names;

    scores={};

    players.forEach(player=>{
        scores[player]=0;
    });

    currentPlayer=0;

    document.getElementById(
        "playersPage"
    ).classList.add("hidden");

    document.getElementById(
        "categoriesPage"
    ).classList.remove("hidden");
}

/* =========================
   اختيار أنواع التحديات
========================= */

function toggleCategory(element,name){

    element.classList.toggle("selected");

    if(selectedCategories.includes(name)){

        selectedCategories=
            selectedCategories.filter(
                x=>x!==name
            );

    }else{

        selectedCategories.push(name);
    }
}

/* بدء اللعبة */

function startGame(){

    if(!selectedCategories.length){

        alert("اختر نوع تحدي واحد على الأقل");

        return;
    }

    resetUsedQuestions();

    document.getElementById(
        "categoriesPage"
    ).classList.add("hidden");

    document.getElementById(
        "wheelArea"
    ).style.display="block";

    buildWheel();
}

/* =========================
   بناء عجلة اللاعبين
========================= */

function buildWheel(){

    const wheel=
        document.getElementById("wheel");

    const n=players.length;

    const colors=[
        "#7c3cff",
        "#ff3b4d",
        "#00a8ff",
        "#00c853",
        "#ff9800",
        "#e91e63",
        "#673ab7",
        "#009688",
        "#795548",
        "#3f51b5",
        "#f44336",
        "#8bc34a"
    ];

    wheel.innerHTML="";

    wheel.style.background=
        `conic-gradient(${
            players
            .map((_,i)=>
                `${colors[i%colors.length]}
                ${i*100/n}%
                ${(i+1)*100/n}%`
            )
            .join(",")
        })`;

    players.forEach((name,i)=>{

        const label=
            document.createElement("div");

        label.className="segment-name";

        const angle=
            (i+.5)*360/n-90;

        const radius=38;

        label.style.left=
            `${50+
            radius*
            Math.cos(
                angle*Math.PI/180
            )}%`;

        label.style.top=
            `${50+
            radius*
            Math.sin(
                angle*Math.PI/180
            )}%`;

        label.textContent=name;

        wheel.appendChild(label);
    });
}

/* =========================
   لف العجلة
========================= */

function spinWheel(){

    if(
        !players.length ||
        !selectedCategories.length
    ){

        return;
    }

    clearInterval(timerInterval);

    document.getElementById(
        "spinBtn"
    ).disabled=true;

    document.getElementById(
        "challengeBox"
    ).style.display="none";

    document.getElementById(
        "timeMessage"
    ).style.display="none";

    /*
      اختيار لاعب عشوائي
    */

    const playerIndex=
        Math.floor(
            Math.random()*players.length
        );

    /*
      اللاعب الذي وقف عليه السهم
    */

    currentPlayer=playerIndex;

    const n=players.length;

    const target=
        360-
        (playerIndex+.5)*360/n;

    rotation+=
        1440+
        target-
        (rotation%360);

    document.getElementById(
        "wheel"
    ).style.transform=
        `rotate(${rotation}deg)`;

    /*
      بعد توقف العجلة
      نختار نوع تحدي عشوائي
    */

    setTimeout(()=>{

        const categoryIndex=
            Math.floor(
                Math.random()*
                selectedCategories.length
            );

        showChallenge(
            selectedCategories[
                categoryIndex
            ]
        );

    },5200);
}

/* =========================
   عرض التحدي
========================= */

function showChallenge(category){

    currentCategory=category;

    const list=
        data[category] || [];

    /*
      إذا خلصت أسئلة التصنيف
    */

    if(
        !usedQuestions[category] ||
        usedQuestions[category].size>=list.length
    ){

        alert(
            `خلصت كل أسئلة ${category} 🎉`
        );

        document.getElementById(
            "spinBtn"
        ).disabled=false;

        return;
    }

    /*
      الأسئلة المتبقية
    */

    const availableQuestions=
        list.filter(
            question=>
                !usedQuestions[
                    category
                ].has(question)
        );

    /*
      اختيار سؤال جديد
    */

    const randomIndex=
        Math.floor(
            Math.random()*
            availableQuestions.length
        );

    currentChallenge=
        availableQuestions[
            randomIndex
        ];

    /*
      تسجيل السؤال
      حتى لا يظهر مرة ثانية
    */

    usedQuestions[
        category
    ].add(currentChallenge);

    /*
      إظهار اسم اللاعب
      الذي وقف عليه السهم
    */

    document.getElementById(
        "turnName"
    ).textContent=
        `🔥 ${players[currentPlayer]}`;

    document.getElementById(
        "turnName"
    ).style.display="block";

    document.getElementById(
        "challengeText"
    ).textContent=
        currentChallenge;

    document.getElementById(
        "challengeBox"
    ).style.display="block";

    document.getElementById(
        "finishBtn"
    ).disabled=false;

    document.getElementById(
        "skipBtn"
    ).disabled=false;

    document.getElementById(
        "timeMessage"
    ).style.display="none";

    /*
      مؤقت السرعة فقط
    */

    if(category==="سرعة ⚡️"){

        startTimer();

    }else{

        document.getElementById(
            "timer"
        ).style.display="none";
    }
}

/* =========================
   مؤقت ٦ ثواني
========================= */

function startTimer(){

    clearInterval(timerInterval);

    timeLeft=6;

    const timer=
        document.getElementById("timer");

    timer.style.display="block";

    timer.textContent="⏱️ 6";

    timerInterval=
        setInterval(()=>{

            timeLeft--;

            timer.textContent=
                `⏱️ ${timeLeft}`;

            if(timeLeft<=0){

                clearInterval(
                    timerInterval
                );

                timerInterval=null;

                timer.style.display="none";

                document.getElementById(
                    "timeMessage"
                ).style.display="block";

                /*
                  انتهى الوقت
                  بدون نقطة
                */

                document.getElementById(
                    "finishBtn"
                ).disabled=true;

                document.getElementById(
                    "skipBtn"
                ).disabled=true;

                setTimeout(()=>{

                    nextTurn();

                },700);
            }

        },1000);
}

/* =========================
   تم = نقطة للاعب
========================= */

function finishChallenge(){

    if(
        document.getElementById(
            "finishBtn"
        ).disabled
    ){

        return;
    }

    clearInterval(timerInterval);

    timerInterval=null;

    /*
      النقطة تروح للاعب
      الذي وقف عليه السهم
    */

    const player=
        players[currentPlayer];

    scores[player]++;

    nextTurn();
}

/* =========================
   سكيب = بدون نقطة
========================= */

function skipChallenge(){

    clearInterval(timerInterval);

    timerInterval=null;

    nextTurn();
}

/* =========================
   اللاعب التالي
========================= */

function nextTurn(){

    clearInterval(timerInterval);

    timerInterval=null;

    document.getElementById(
        "challengeBox"
    ).style.display="none";

    document.getElementById(
        "timeMessage"
    ).style.display="none";

    document.getElementById(
        "timer"
    ).style.display="none";

    document.getElementById(
        "finishBtn"
    ).disabled=false;

    document.getElementById(
        "skipBtn"
    ).disabled=false;

    /*
      هنا ما نغير اللاعب يدويًا
      لأن اللاعب القادم يتحدد
      من السهم في اللفة القادمة
    */

    document.getElementById(
        "spinBtn"
    ).disabled=false;
}

/* =========================
   النتائج
========================= */

function endGame(){

    clearInterval(timerInterval);

    document.getElementById(
        "wheelArea"
    ).style.display="none";

    document.getElementById(
        "results"
    ).style.display="block";

    const ranking=
        document.getElementById(
            "ranking"
        );

    ranking.innerHTML="";

    Object.entries(scores)
        .sort((a,b)=>b[1]-a[1])
        .forEach(([name,score],i)=>{

            const div=
                document.createElement("div");

            div.className="rank";

            let medal="";

            if(i===0)
                medal="🥇";

            else if(i===1)
                medal="🥈";

            else if(i===2)
                medal="🥉";

            div.textContent=
                `${medal} ${i+1}. ${name} — ${score} نقطة`;

            ranking.appendChild(div);
        });
}

</script>
