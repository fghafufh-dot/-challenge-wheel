<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎡 عجلة التحديات</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Tahoma,sans-serif;
 background:linear-gradient(145deg,#080812,#15102b,#090914);
 color:white;
 min-height:100vh;
 text-align:center;
}
.screen{
 display:none;
 min-height:100vh;
 padding:35px 18px;
 align-items:center;
 justify-content:center;
 flex-direction:column;
}
.screen.active{display:flex}
.card{
 width:min(620px,100%);
 background:rgba(25,22,48,.92);
 border:1px solid rgba(255,255,255,.1);
 border-radius:25px;
 padding:28px 20px;
 box-shadow:0 15px 50px rgba(0,0,0,.4);
}
h1{font-size:38px;margin:10px 0}
h2{font-size:28px}
p{color:#c9c5d9}
button{
 border:0;
 border-radius:15px;
 padding:15px 22px;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
 color:white;
 background:#6c3cff;
 margin:7px;
}
button:hover{filter:brightness(1.12)}
.primary{background:#ffd21f;color:#17120a}
.danger{background:#e53935}
.success{background:#21c77a}
.skip{background:#4b4b5e}
input{
 width:100%;
 padding:16px;
 border-radius:14px;
 border:1px solid #444;
 background:#11101d;
 color:white;
 font-size:18px;
 outline:none;
 margin:7px 0;
}
.playerRow{
 display:flex;
 gap:7px;
 margin-bottom:8px;
}
.playerRow input{margin:0}
.playerRow button{
 margin:0;
 padding:10px 15px;
}
.playersList{
 display:grid;
 gap:8px;
 margin:15px 0;
}
.playerItem{
 background:#17152a;
 padding:12px;
 border-radius:12px;
}
.categories{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
 margin:20px 0;
}
.cat{
 background:#19172c;
 border:2px solid #37324e;
 padding:18px 10px;
 border-radius:17px;
 cursor:pointer;
 font-size:17px;
 font-weight:bold;
}
.cat.selected{
 border-color:#ffd21f;
 background:#302a10;
}
.wheelWrap{
 position:relative;
 width:min(88vw,470px);
 aspect-ratio:1;
 margin:15px auto 25px;
}
#wheel{
 width:100%;
 height:100%;
 border-radius:50%;
 border:8px solid #fff;
 box-shadow:0 0 35px rgba(108,60,255,.45);
 transition:transform 4s cubic-bezier(.12,.7,.18,1);
}
.pointer{
 position:absolute;
 top:-18px;
 left:50%;
 transform:translateX(-50%);
 width:0;
 height:0;
 border-left:18px solid transparent;
 border-right:18px solid transparent;
 border-top:38px solid #ffd21f;
 z-index:5;
 filter:drop-shadow(0 3px 3px #000);
}
.spin{
 font-size:22px;
 padding:17px 40px;
 background:#ffd21f;
 color:#111;
}
.current{
 font-size:25px;
 font-weight:bold;
 margin:8px;
 color:#ffd21f;
}
.challenge{
 margin:20px auto;
 background:#11101d;
 border:2px solid #6c3cff;
 border-radius:20px;
 padding:22px;
 font-size:22px;
 line-height:1.7;
 max-width:600px;
}
.timer{
 font-size:42px;
 font-weight:bold;
 color:#ffd21f;
 margin:8px;
}
.score{
 display:flex;
 justify-content:space-between;
 background:#17152a;
 padding:15px 18px;
 border-radius:14px;
 margin:8px 0;
 font-size:19px;
}
.small{font-size:14px;color:#aaa}
.hidden{display:none!important}
@media(max-width:500px){
 h1{font-size:31px}
 h2{font-size:24px}
 .card{padding:22px 14px}
 .categories{gap:8px}
 .cat{padding:15px 5px;font-size:15px}
}
</style>
</head>

<body>

<!-- البداية -->
<section id="home" class="screen active">
 <div class="card">
  <div style="font-size:70px">🎡</div>
  <h1>عجلة التحديات</h1>
  <p>لعبة جماعية سريعة وممتعة 🔥</p>
  <p>إنشاء وتصميم عادل</p>
  <button class="primary" onclick="showPlayers()">بدء اللعبة</button>
 </div>
</section>

<!-- اللاعبين -->
<section id="playersScreen" class="screen">
 <div class="card">
  <h2>👥 أسماء اللاعبين</h2>
  <p>أدخل من 2 إلى 12 لاعب</p>

  <div id="playerInputs"></div>

  <button onclick="addPlayerInput()">➕ إضافة لاعب</button>
  <button class="primary" onclick="goCategories()">التالي ➡️</button>

  <div id="playersError" style="color:#ff5555"></div>
 </div>
</section>

<!-- التصنيفات -->
<section id="categoriesScreen" class="screen">
 <div class="card">
  <h2>اختر نوع التحدي الي تبيه</h2>
  <p>تقدر تختار أكثر من نوع</p>

  <div class="categories">
   <div class="cat" data-cat="funny" onclick="toggleCat(this)">مضحكة 😂</div>
   <div class="cat" data-cat="smart" onclick="toggleCat(this)">ذكاء 🧠</div>
   <div class="cat" data-cat="acting" onclick="toggleCat(this)">تمثيل 🎭</div>
   <div class="cat" data-cat="speed" onclick="toggleCat(this)">سرعة ⚡️</div>
   <div class="cat" data-cat="bold" onclick="toggleCat(this)">جريئة 😈</div>
   <div class="cat" data-cat="group" onclick="toggleCat(this)">تحديات 👥</div>
  </div>

  <button class="primary" onclick="startGame()">🔥 ابدأ التحدي</button>
  <div id="catError" style="color:#ff5555"></div>
 </div>
</section>

<!-- اللعبة -->
<section id="gameScreen" class="screen">
 <div class="card">
  <div class="small">🎡 عجلة اللاعبين</div>

  <div class="current" id="currentPlayer"></div>

  <div class="wheelWrap">
   <div class="pointer"></div>
   <canvas id="wheel"></canvas>
  </div>

  <button class="spin" id="spinBtn" onclick="spinWheel()">🎡 لف العجلة</button>

  <div id="challengeArea" class="hidden">
   <div class="current" id="challengePlayer"></div>
   <div id="timer" class="timer hidden">6</div>
   <div id="challenge" class="challenge"></div>

   <button class="success" id="finishBtn" onclick="finishChallenge()">تم ✅</button>
   <button class="skip" id="skipBtn" onclick="skipChallenge()">سكيب ⏭️</button>
  </div>
 </div>
</section>

<!-- النتائج -->
<section id="resultsScreen" class="screen">
 <div class="card">
  <h1>🏆 النتائج</h1>
  <div id="results"></div>
  <button class="primary" onclick="location.reload()">🔄 لعبة جديدة</button>
 </div>
</section>

function showScreen(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function showPlayers(){
 showScreen("playersScreen");
 if(document.querySelectorAll(".playerRow").length===0){
  addPlayerInput();
  addPlayerInput();
 }
}

function addPlayerInput(){
 const box=document.getElementById("playerInputs");
 if(box.children.length>=12)return;

 const row=document.createElement("div");
 row.className="playerRow";

 const input=document.createElement("input");
 input.placeholder="اسم اللاعب "+(box.children.length+1);
 input.maxLength=20;

 const del=document.createElement("button");
 del.textContent="✖";
 del.className="danger";
 del.onclick=()=>row.remove();

 row.appendChild(input);
 row.appendChild(del);
 box.appendChild(row);
}

function goCategories(){
 const inputs=[...document.querySelectorAll("#playerInputs input")];

 players=inputs.map(i=>i.value.trim()).filter(Boolean);

 if(players.length<2){
  document.getElementById("playersError").textContent="لازم تدخل لاعبين على الأقل";
  return;
 }

 if(players.length>12){
  document.getElementById("playersError").textContent="الحد الأقصى 12 لاعب";
  return;
 }

 if(new Set(players).size!==players.length){
  document.getElementById("playersError").textContent="لا تكرر اسم اللاعب";
  return;
 }

 scores={};
 players.forEach(p=>scores[p]=0);

 document.getElementById("playersError").textContent="";
 showScreen("categoriesScreen");
}

 el.classList.toggle("selected");
}

 selectedCategories=[...document.querySelectorAll(".cat.selected")]
  .map(x=>x.dataset.cat);

 if(selectedCategories.length===0){
  document.getElementById("catError").textContent="اختر نوع تحدي واحد على الأقل";
  return;
 }

 document.getElementById("catError").textContent="";
 drawWheel();
 showScreen("gameScreen");
}

function drawWheel(){
 const canvas=document.getElementById("wheel");
 const ctx=canvas.getContext("2d");

 const size=700;
 canvas.width=size;
 canvas.height=size;

 const center=size/2;
 const radius=size/2-5;
 const slice=(Math.PI*2)/players.length;

 const colors=[
  "#6c3cff",
  "#ff3b81",
  "#00bcd4",
  "#ff9800",
  "#21c77a",
  "#e91e63",
  "#795548",
  "#3f51b5",
  "#9c27b0",
  "#009688",
  "#f44336",
  "#607d8b"
 ];

 ctx.clearRect(0,0,size,size);

 players.forEach((name,i)=>{
  const start=-Math.PI/2+i*slice;

  ctx.beginPath();
  ctx.moveTo(center,center);
  ctx.arc(center,center,radius,start,start+slice);
  ctx.closePath();

  ctx.fillStyle=colors[i%colors.length];
  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.save();
  ctx.translate(center,center);
  ctx.rotate(start+slice/2);

  ctx.textAlign="right";
  ctx.textBaseline="middle";
  ctx.fillStyle="#fff";
  ctx.font="bold 25px Arial";

  let text=name;
  if(text.length>13)text=text.substring(0,13)+"…";

  ctx.fillText(text,radius-25,0);
  ctx.restore();
 });

 ctx.beginPath();
 ctx.arc(center,center,55,0,Math.PI*2);
 ctx.fillStyle="#111";
 ctx.fill();
 ctx.strokeStyle="#fff";
 ctx.lineWidth=4;
 ctx.stroke();

 ctx.fillStyle="#ffd21f";
 ctx.font="bold 24px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText("🎡",center,center);
}

function spinWheel(){

 if(spinning)return;

 spinning=true;

 clearInterval(timerInterval);

 document.getElementById("challengeArea").classList.add("hidden");
 document.getElementById("spinBtn").disabled=true;

 const count=players.length;
 const slice=360/count;

 const index=Math.floor(Math.random()*count);

 currentPlayer=players[index];

 const target=360-(index*slice+slice/2);

 rotation += 360*5 + target;

 document.getElementById("wheel").style.transform=
   `rotate(${rotation}deg)`;

 setTimeout(()=>{

  document.getElementById("currentPlayer").textContent=
   "🔥 "+currentPlayer;

  showChallenge();

  spinning=false;
  document.getElementById("spinBtn").disabled=false;

 },4100);
}

function getQuestion(){

 const available=[];

 selectedCategories.forEach(cat=>{
  const list=questions[cat];

  list.forEach((q,i)=>{
   if(!usedQuestions[cat].has(i)){
    available.push({cat:cat,index:i,text:q});
   }
  });
 });

 if(available.length===0){

  Object.keys(usedQuestions).forEach(cat=>{
   usedQuestions[cat].clear();
  });

  return getQuestion();
 }

 const chosen=available[Math.floor(Math.random()*available.length)];

 usedQuestions[chosen.cat].add(chosen.index);

 return chosen;
}

function showChallenge(){

 const chosen=getQuestion();

 currentCategory=chosen.cat;
 currentQuestion=chosen.text;

 document.getElementById("challengePlayer").textContent=
   "🔥 "+currentPlayer;

 document.getElementById("challenge").textContent=
   currentQuestion;

 document.getElementById("challengeArea").classList.remove("hidden");

 document.getElementById("finishBtn").disabled=false;
 document.getElementById("skipBtn").disabled=false;

 const timer=document.getElementById("timer");

 if(currentCategory==="speed"){

  timer.classList.remove("hidden");

  let seconds=6;
  timer.textContent=seconds;

  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{

   seconds--;
   timer.textContent=seconds;

   if(seconds<=0){

    clearInterval(timerInterval);

    document.getElementById("finishBtn").disabled=true;
    document.getElementById("skipBtn").disabled=true;

    timer.textContent="انتهى الوقت!";

    setTimeout(()=>{
     nextTurn();
    },700);
   }

  },1000);

 }else{

  clearInterval(timerInterval);
  timer.classList.add("hidden");
 }
}

function finishChallenge(){

 if(spinning)return;

 clearInterval(timerInterval);

 if(!currentPlayer)return;

 scores[currentPlayer]++;

 nextTurn();
}

function skipChallenge(){

 clearInterval(timerInterval);

 nextTurn();
}

function nextTurn(){

 document.getElementById("challengeArea").classList.add("hidden");

 document.getElementById("finishBtn").disabled=false;
 document.getElementById("skipBtn").disabled=false;

 document.getElementById("timer").classList.add("hidden");

 document.getElementById("currentPlayer").textContent="";

}

function showResults(){

 clearInterval(timerInterval);

 const sorted=[...players].sort((a,b)=>scores[b]-scores[a]);

 const box=document.getElementById("results");

 box.innerHTML="";

 sorted.forEach((p,i)=>{

  const row=document.createElement("div");
  row.className="score";

  row.innerHTML=
   `<span>${i+1}. ${escapeHTML(p)}</span>
    <strong>${scores[p]} نقطة</strong>`;

  box.appendChild(row);
 });

 showScreen("resultsScreen");
}

function escapeHTML(text){

 const div=document.createElement("div");
 div.textContent=text;
 return div.innerHTML;

}

window.addEventListener("beforeunload",()=>{
 clearInterval(timerInterval);
});

</script>

</body>
</html>
